<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14532d">
<title>QC Sơn — Sơn phủ kết cấu thép</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<style>
  :root{
    --bg:#eff3ef; --card:#fff; --ink:#1b2430; --muted:#5f6b7a; --line:#dde5dd;
    --brand:#14532d; --brand2:#1f7a43; --soft:#e7f4ec;
    --pass:#0f6e56; --pass-soft:#e3f6ee; --fail:#aa4322; --fail-soft:#fbeae2;
    --warn:#8a5a00; --warn-soft:#fdf3e2;
    --r:14px; --sh:0 1px 2px rgba(20,45,30,.07),0 6px 20px rgba(20,45,30,.06);
    --navh:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:0;background:none}
  input,select{font-family:inherit}
  .appbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#14532d,#0e3d21);color:#fff;
    padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
  .appbar .back{color:#fff;font-size:15px;font-weight:700;padding:6px 8px 6px 0}
  .appbar h1{font-size:16px;margin:0;font-weight:700;line-height:1.15}
  .appbar .sub{font-size:11px;opacity:.8}
  .appbar .sp{flex:1}
  .lang{display:flex;background:rgba(255,255,255,.16);border-radius:8px;overflow:hidden}
  .lang button{color:#fff;padding:6px 11px;font-size:13px;font-weight:700;opacity:.65}
  .lang button.on{background:#fff;color:var(--brand);opacity:1}
  .main{max-width:1180px;margin:0 auto;padding:12px 14px calc(var(--navh) + 24px)}
  @media(min-width:980px){.main{padding-bottom:28px}}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:6px 2px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.05)}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:10px;font-weight:600;padding:4px 5px;border-radius:10px;flex:1}
  .nav button .ic{font-size:19px;line-height:1}
  .nav button.on{color:var(--brand)}
  @media(min-width:980px){
    .nav{position:sticky;top:58px;bottom:auto;z-index:39;max-width:1180px;margin:10px auto 0;border:1px solid var(--line);border-radius:12px;justify-content:flex-start;gap:4px;padding:6px;box-shadow:var(--sh)}
    .nav button{flex:none;flex-direction:row;gap:7px;font-size:14px;padding:9px 16px}
    .nav button .ic{font-size:17px}
    .nav button.on{background:var(--soft)}
  }
  .seccard{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;padding:16px}
  .seccard h3{margin:0 0 8px;font-size:16px;color:var(--brand)}
  .seccard .note{font-size:12.5px;color:var(--muted);margin:8px 0 0}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{border:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
  th{background:var(--soft);color:var(--brand);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
  tr:nth-child(even) td{background:#f8fbf8}
  .tblwrap{overflow-x:auto;margin-top:10px}
  .evidence{background:#fbfdf9;border:1px dashed var(--brand2);border-radius:12px;padding:12px 14px;margin-top:12px}
  .evidence .h{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--brand);text-transform:uppercase}
  .quote{font-style:italic;color:#33404e;border-left:3px solid var(--soft);padding-left:10px;margin-top:8px;font-size:12.5px}
  .warn{background:var(--warn-soft);border:1px solid #f0d9a8;border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#6b4700;margin-top:10px}
  .accept{background:#f4faf7;border:1px solid #cfe8df;border-left:4px solid var(--pass);border-radius:10px;padding:11px 13px;font-size:13px;margin-top:10px}
  .inrow{display:flex;gap:10px;align-items:center;margin:8px 0}
  .inrow .lab{font-size:12px;color:var(--muted);flex:1}
  .inrow input,.inrow textarea{width:130px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;font-size:16px;text-align:right}
  textarea.wide{width:100% !important;text-align:left !important;min-height:64px;font-size:14px !important}
  .res{background:#0d2b18;color:#fff;border-radius:12px;padding:14px;margin-top:12px}
  .res .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
  .res .big{font-size:16px;font-weight:700;margin-top:4px;line-height:1.5}
  .verdict{border-radius:12px;padding:16px;text-align:center;margin-top:12px;font-weight:800;font-size:20px}
  .verdict.pass{background:var(--pass-soft);color:var(--pass);border:1px solid #b7e0d2}
  .verdict.fail{background:var(--fail-soft);color:var(--fail);border:1px solid #f0c4b3}
  .h2x{font-size:18px;font-weight:800;color:var(--brand);margin:14px 2px 10px}
  /* defects */
  .search{position:relative;margin:12px 0 10px}
  .search input{width:100%;padding:13px 14px 13px 42px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;box-shadow:var(--sh)}
  .search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;font-size:17px}
  .filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px}
  .filters::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#33404e;white-space:nowrap;flex:none}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .dfcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden}
  .dfcard summary{padding:13px 16px;font-weight:700;font-size:14.5px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px}
  .dfcard summary::-webkit-details-marker{display:none}
  .dfcard summary .gb{margin-left:auto;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:6px;background:var(--soft);color:var(--brand);flex:none}
  .dfcard .body{padding:0 16px 14px;font-size:13.5px}
  .dfcard .row{margin-top:9px}
  .dfcard .row b{color:var(--brand)}
  .ckphase{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px;overflow:hidden}
  .ckphase .ph{display:flex;align-items:center;gap:10px;padding:13px 16px;background:var(--soft);font-weight:800;color:var(--brand);font-size:15px}
  .ckphase .ph .pct{margin-left:auto;font-size:12.5px;font-weight:700;color:var(--muted)}
  .ckitem{display:flex;gap:11px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;align-items:flex-start}
  .ckitem:hover{background:#f8fbf8}
  .ckitem .box{width:22px;height:22px;border:2px solid #b9cabd;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;margin-top:1px}
  .ckitem.done .box{background:var(--pass);border-color:var(--pass)}
  .ckitem .tx{font-size:13.5px}
  .ckitem.done .tx{color:var(--muted);text-decoration:line-through}
  .ckitem .rf{display:block;font-size:11px;color:var(--brand2);font-weight:700;margin-top:3px}
  .ckbar{display:flex;gap:8px;margin-bottom:12px}
  .btn{padding:10px 16px;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:13.5px}
  .btn.alt{background:#e4ece5;color:#33503c}
  .tab{display:none}
  .tab.on{display:block;animation:fadein .25s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  ul.tight{margin:8px 0 0;padding-left:20px;font-size:13.5px}
  ul.tight li{margin-bottom:7px}
  .h2x{display:flex;align-items:center;gap:10px}
  .h2x::after{content:"";flex:1;height:1px;background:var(--line)}
  .seccard,.dfcard{transition:box-shadow .15s ease}
  .seccard:hover,.dfcard:hover{box-shadow:0 2px 4px rgba(20,45,30,.08),0 10px 28px rgba(20,45,30,.1)}
  .btn:active,button:active{transform:scale(.98)}
</style>
</head>
<body>

<header class="appbar">
  <a class="back" href="../">←</a>
  <div>
    <h1>QC Sơn — Sơn phủ kết cấu thép</h1>
    <div class="sub">ISO 8501/8502/8503 · ISO 19840 · ISO 12944 · EN 1090-2 · SSPC-PA2</div>
  </div>
  <div class="sp"></div>
  <div class="lang">
    <button id="lvVi" class="on">VI</button>
    <button id="lvEn">EN</button>
  </div>
</header>

<nav class="nav">
  <button data-tab="qt" class="on"><span class="ic">🪜</span><span data-vi="Quy trình" data-en="Steps">Quy trình</span></button>
  <button data-tab="surf"><span class="ic">🧹</span><span data-vi="Bề mặt" data-en="Surface">Bề mặt</span></button>
  <button data-tab="env"><span class="ic">🌡</span><span data-vi="Môi trường" data-en="Climate">Môi trường</span></button>
  <button data-tab="dft"><span class="ic">📏</span><span data-vi="DFT" data-en="DFT">DFT</span></button>
  <button data-tab="test"><span class="ic">🔬</span><span data-vi="Kiểm tra" data-en="Tests">Kiểm tra</span></button>
  <button data-tab="bec"><span class="ic">🔫</span><span data-vi="Thi công" data-en="Application">Thi công</span></button>
  <button data-tab="def"><span class="ic">⚠️</span><span data-vi="Lỗi sơn" data-en="Defects">Lỗi sơn</span></button>
  <button data-tab="zn"><span class="ic">🛡️</span><span data-vi="Mạ kẽm" data-en="Galv.">Mạ kẽm</span></button>
  <button data-tab="do"><span class="ic">📷</span><span data-vi="Đo ảnh" data-en="Photo">Đo ảnh</span></button>
  <button data-tab="ck"><span class="ic">☑️</span><span data-vi="Checklist" data-en="Checklist">Checklist</span></button>
  <button data-tab="itp"><span class="ic">🗂</span><span data-vi="ITP" data-en="ITP">ITP</span></button>
</nav>

<main class="main">
  <section class="tab on" id="tab-qt"></section>
  <section class="tab" id="tab-surf"></section>
  <section class="tab" id="tab-env"></section>
  <section class="tab" id="tab-dft"></section>
  <section class="tab" id="tab-test"></section>
  <section class="tab" id="tab-bec"></section>
  <section class="tab" id="tab-def"></section>
  <section class="tab" id="tab-zn"></section>
  <section class="tab" id="tab-do">
    <div class="h2x">📷 Đo lỗi sơn trên ảnh</div>
    <div class="seccard" id="photoMount"></div>
  </section>
  <section class="tab" id="tab-ck"></section>
  <section class="tab" id="tab-itp">
    <div class="h2x">🗂 Quy trình kiểm soát chất lượng (ITP)</div>
    <div id="itpMount"></div>
  </section>
</main>

<script src="data.js"></script>
<script src="../photo-tool.js"></script>
<script src="../report.js"></script>
<script src="../itp.js"></script>
<script src="../itp-data.js"></script>
<script src="../qclog.js"></script>
<script>
const D = window.SON_DATA;
let LANG = localStorage.getItem('son_lang') || 'vi';
const T = o => (o && typeof o === 'object') ? (o[LANG] || o.vi || '') : (o || '');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const softWarn = () => `<div class="warn">${LANG==='vi'
  ? '⚠ Mục tổng hợp từ tiêu chuẩn không có bản PDF gốc trong dự án — đối chiếu bản gốc/spec dự án trước khi dùng làm căn cứ nghiệm thu chính thức.'
  : '⚠ Compiled reference — verify against the original standard/project spec before formal acceptance.'}</div>`;

document.querySelectorAll('.nav button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.nav button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    document.getElementById('tab-' + b.dataset.tab).classList.add('on');
    window.scrollTo(0, 0);
  });
});
function setLang(l) {
  LANG = l; localStorage.setItem('son_lang', l);
  document.getElementById('lvVi').classList.toggle('on', l === 'vi');
  document.getElementById('lvEn').classList.toggle('on', l === 'en');
  document.querySelectorAll('[data-vi]').forEach(e => e.textContent = e.dataset[l]);
  renderAll();
}
document.getElementById('lvVi').onclick = () => setLang('vi');
document.getElementById('lvEn').onclick = () => setLang('en');

/* ===== HÌNH VẼ CÁCH ĐO (SVG) ===== */
const SK_INK='#1b2430', SK_DIM='#aa4322', SK_BR='#14532d', SK_STEEL='#cdd6df', SK_PAINT='#7fb89a';
const skSvg=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto"><defs><marker id="sah" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="${SK_DIM}"/></marker></defs>${inner}</svg>`;
const skLbl=(x,y,t,c,a)=>`<text x="${x}" y="${y}" font-size="11" font-weight="700" fill="${c||SK_DIM}" text-anchor="${a||'middle'}" font-family="Segoe UI,Arial">${t}</text>`;
const SK = {
  dft: () => skSvg(320,135,`
    <rect x="20" y="100" width="280" height="26" fill="${SK_STEEL}" stroke="${SK_INK}" stroke-width="1.5"/>
    <rect x="20" y="88" width="280" height="12" fill="${SK_PAINT}" stroke="${SK_INK}" stroke-width="1"/>
    <rect x="140" y="30" width="40" height="42" rx="6" fill="#fff" stroke="${SK_BR}" stroke-width="2"/>
    <rect x="154" y="72" width="12" height="16" fill="#fff" stroke="${SK_BR}" stroke-width="2"/>
    <line x1="160" y1="20" x2="160" y2="30" stroke="${SK_BR}" stroke-width="1.5"/>
    ${skLbl(160,48,'88',SK_BR)}${skLbl(160,60,'µm','#5f6b7a')}
    <line x1="240" y1="88" x2="240" y2="100" stroke="${SK_DIM}" stroke-width="1.3" marker-end="url(#sah)"/>
    ${skLbl(252,84,'DFT',SK_DIM,'start')}
    ${skLbl(228,36,'đầu dò vuông góc',SK_BR)}`),
  env: () => skSvg(320,135,`
    <rect x="20" y="100" width="280" height="24" fill="${SK_STEEL}" stroke="${SK_INK}" stroke-width="1.5"/>
    <rect x="60" y="60" width="14" height="40" rx="4" fill="#fff" stroke="${SK_BR}" stroke-width="2"/>
    <circle cx="67" cy="96" r="6" fill="#c0241c"/>
    ${skLbl(67,50,'Ts (thép)',SK_BR)}
    <rect x="200" y="36" width="62" height="44" rx="6" fill="#fff" stroke="${SK_BR}" stroke-width="2"/>
    ${skLbl(231,54,'RH %',SK_BR)}${skLbl(231,68,'Ta · Td','#5f6b7a')}
    ${skLbl(160,20,'ĐẠT: Ts ≥ Td + 3°C · RH ≤ 85%',SK_DIM)}`),
  profile: () => skSvg(320,135,`
    <path d="M20,106 l12,-10 l10,9 l12,-12 l10,10 l12,-9 l10,10 l12,-11 l11,10 l12,-10 l10,9 l12,-11 l11,10 l12,-9 l10,9 l12,-11 l11,11 l12,-10 l10,9 l12,-10 l11,10" fill="none" stroke="${SK_INK}" stroke-width="1.6"/>
    <rect x="20" y="108" width="280" height="16" fill="${SK_STEEL}" stroke="${SK_INK}" stroke-width="1.2"/>
    <rect x="120" y="54" width="80" height="22" rx="3" fill="#fff" stroke="${SK_BR}" stroke-width="2"/>
    ${skLbl(160,69,'replica tape',SK_BR)}
    <line x1="90" y1="96" x2="90" y2="106" stroke="${SK_DIM}" stroke-width="1.2" marker-end="url(#sah)"/>
    ${skLbl(76,90,'Ry5',SK_DIM)}
    ${skLbl(240,94,'trừ 50µm đế','#5f6b7a')}`),
  bresle: () => skSvg(320,135,`
    <rect x="20" y="100" width="280" height="24" fill="${SK_STEEL}" stroke="${SK_INK}" stroke-width="1.5"/>
    <rect x="110" y="60" width="100" height="40" rx="8" fill="#e7f4ec" stroke="${SK_BR}" stroke-width="2"/>
    <circle cx="160" cy="80" r="13" fill="#fff" stroke="${SK_BR}" stroke-width="1.4"/>
    ${skLbl(160,46,'miếng dán Bresle',SK_BR)}
    <path d="M232,36 l-50,30" stroke="${SK_BR}" stroke-width="1.4"/>
    <rect x="228" y="18" width="14" height="30" rx="6" fill="#fff" stroke="${SK_BR}" stroke-width="1.6"/>
    ${skLbl(252,30,'bơm 3ml',SK_BR,'start')}
    ${skLbl(64,46,'bơm–hút 4 lần',SK_DIM)}`),
  crosscut: () => skSvg(320,135,`
    <rect x="40" y="22" width="90" height="90" fill="${SK_PAINT}" stroke="${SK_INK}" stroke-width="1.2"/>
    ${[0,1,2,3,4,5].map(i=>`<line x1="${52+i*13}" y1="26" x2="${52+i*13}" y2="108" stroke="#fff" stroke-width="2"/>`).join('')}
    ${[0,1,2,3,4,5].map(i=>`<line x1="44" y1="${34+i*13}" x2="126" y2="${34+i*13}" stroke="#fff" stroke-width="2"/>`).join('')}
    <rect x="190" y="38" width="90" height="26" rx="4" fill="#fdf3e2" stroke="${SK_DIM}" stroke-width="1.5"/>
    ${skLbl(235,54,'băng keo chuẩn',SK_DIM)}
    ${skLbl(235,84,'dán 90s → giật 60°','#5f6b7a')}
    ${skLbl(85,126,'lưới 6×6 tới nền',SK_BR)}`),
  pulloff: () => skSvg(320,135,`
    <rect x="20" y="100" width="280" height="24" fill="${SK_STEEL}" stroke="${SK_INK}" stroke-width="1.5"/>
    <rect x="20" y="90" width="280" height="10" fill="${SK_PAINT}" stroke="${SK_INK}" stroke-width="1"/>
    <rect x="135" y="70" width="50" height="20" fill="#fff" stroke="${SK_BR}" stroke-width="2"/>
    <rect x="150" y="34" width="20" height="36" fill="#fff" stroke="${SK_BR}" stroke-width="2"/>
    <line x1="160" y1="14" x2="160" y2="34" stroke="${SK_DIM}" stroke-width="1.6" marker-end="url(#sah)" transform="rotate(180 160 24)"/>
    ${skLbl(186,26,'kéo vuông góc',SK_DIM,'start')}
    ${skLbl(126,82,'dolly Ø20',SK_BR,'end')}
    ${skLbl(248,82,'đọc MPa khi đứt','#5f6b7a')}`)
};
const measureCard = (title, sk, steps) => `<div class="seccard"><h3>📐 ${title}</h3>
  <div style="background:#fbfdf9;border:1px solid var(--line);border-radius:10px;padding:8px;max-width:430px;margin:0 auto">${sk}</div>
  <div style="font-size:13.5px;margin-top:10px;line-height:1.65">${steps}</div></div>`;

/* ===== TAB QUY TRÌNH — 9 bước chi tiết ===== */
function renderQT() {
  const v = LANG === 'vi';
  const S = v ? [
    ['Nghiệm thu P-grade trước phun', 'Mối hàn/cạnh đạt P1/P2/P3 theo hợp đồng (mài cạnh sắc, bỏ spatter); QC Dim đã đạt — sơn xong không sửa kết cấu được nữa.', 'Tab Bề mặt (bảng P đã xác minh) + biên bản'],
    ['Tẩy dầu mỡ + che chắn', 'Solvent clean toàn bộ trước phun hạt; che ren/mặt gia công không sơn.', 'SSPC-SP1 + băng che'],
    ['Phun hạt + nghiệm thu 4 phép (ĐIỂM DỪNG)', 'Cấp sạch (thường Sa 2½) so ảnh chuẩn + độ nhám replica tape + bụi tape test + muối Bresle — đạt cả 4 mới sơn lót; lớp lót phải phủ trong 4h (hoặc trước khi gỉ lại).', 'Tab Bề mặt — 4 phép có hình cách đo'],
    ['Đo môi trường TRƯỚC khi mở sơn', 'Ts ≥ điểm sương +3°C, RH ≤ 85%, nhiệt độ trong dải PDS — nhập 3 số ra ĐƯỢC/KHÔNG; đo lại mỗi 2–4h.', 'Tab Môi trường (calculator điểm sương)'],
    ['Trộn sơn đúng PDS', 'Đúng tỷ lệ A:B bằng cân/đong, khuấy máy, đủ induction time, theo dõi pot life — hết pot life là bỏ.', 'PDS + cân + đồng hồ'],
    ['Stripe coat trước', 'Chổi/rulo cạnh, bu lông, mối hàn, góc khuất TRƯỚC mỗi lớp phun — nơi hỏng sơn số 1 nếu bỏ qua.', 'Chổi + rulo nhỏ'],

/* ===== ENV + dew point calc ===== */
function dewPoint(t, rh) {
  const a = 17.625, b = 243.04;
  const g = Math.log(rh / 100) + a * t / (b + t);
  return b * g / (a - g);
}
function renderEnv() {
  const v = LANG === 'vi';
  let h = `<div class="h2x">${v?'Điều kiện môi trường thi công':'Application climate conditions'}</div>`;
  h += `<div class="seccard"><h3>🧮 ${v?'Tính điểm sương & đánh giá điều kiện sơn':'Dew point calculator & condition check'}</h3>
    <div class="inrow"><span class="lab">${v?'Nhiệt độ không khí (°C)':'Air temperature (°C)'}</span><input type="number" step="any" id="eT" value="30"></div>
    <div class="inrow"><span class="lab">${v?'Độ ẩm tương đối RH (%)':'Relative humidity (%)'}</span><input type="number" step="any" id="eRH" value="75"></div>
    <div class="inrow"><span class="lab">${v?'Nhiệt độ bề mặt thép (°C)':'Steel surface temp (°C)'}</span><input type="number" step="any" id="eTs" value="32"></div>
    <div id="eOut"></div>
    <div class="note">${v?'Điểm sương tính theo công thức Magnus (xấp xỉ ±0.4°C trong dải 0–60°C). Hiện trường nên dùng máy đo điểm sương/whirling hygrometer + bảng tra ISO 8502-4.':'Dew point per Magnus formula (±0.4°C, 0–60°C). On site use dew point meter / hygrometer + ISO 8502-4 tables.'}</div></div>`;
  h += measureCard(v?'Cách đo điều kiện môi trường (ISO 8502-4)':'Measuring climate conditions (ISO 8502-4)', SK.env(),
    v?'1) Nhiệt độ thép Ts: nhiệt kế tiếp xúc nam châm áp vào bề mặt, chờ ổn định ≥1 phút, đo tại chỗ LẠNH NHẤT (mặt khuất nắng, bản cánh dưới). 2) RH + nhiệt độ khí: whirling hygrometer (quay 1 phút) hoặc máy điện tử, đặt gần bề mặt thi công. 3) Tra/tính Td rồi kiểm Ts − Td ≥ 3°C. 4) Ghi vào nhật ký: đầu ca, mỗi 2–4h, khi thời tiết đổi.'
     :'1) Steel temp Ts: magnetic contact thermometer ≥1 min at COLDEST spot. 2) RH + air temp: whirling hygrometer or electronic meter near work surface. 3) Determine Td, check Ts − Td ≥ 3°C. 4) Log start of shift, every 2–4h, on weather change.');
  h += D.ENV.rules.map(r => `<div class="seccard"><h3>${esc(T(r.t))}</h3>
    <div style="font-size:13.5px">${esc(T(r.d))}</div>
    <div class="note">📎 ${esc(T(r.ref))}</div></div>`).join('');
  h += `<div class="seccard"><h3>${v?'Tần suất đo & ghi chép':'Measurement frequency & records'}</h3><div style="font-size:13.5px">${esc(T(D.ENV.measure))}</div></div>`;
  document.getElementById('tab-env').innerHTML = h;
  const run = () => {
    const t = +document.getElementById('eT').value || 0, rh = +document.getElementById('eRH').value || 0, ts = +document.getElementById('eTs').value || 0;
    const dp = dewPoint(t, rh), delta = ts - dp;
    const okDp = delta >= 3, okRh = rh <= 85;
    document.getElementById('eOut').innerHTML = `
      <div class="res"><div class="lbl">${v?'Kết quả':'Result'}</div><div class="big">
        ${v?'Điểm sương':'Dew point'} Td = <b>${Math.round(dp*10)/10}°C</b><br>
        Ts − Td = <b>${Math.round(delta*10)/10}°C</b> (${v?'yêu cầu':'required'} ≥ 3°C)<br>
        RH = ${rh}% (${v?'yêu cầu':'required'} ≤ 85%)</div></div>
      <div class="verdict ${okDp&&okRh?'pass':'fail'}">${okDp&&okRh?(v?'✓ ĐƯỢC PHÉP SƠN':'✓ OK TO PAINT'):(v?'✗ KHÔNG SƠN — chờ điều kiện đạt':'✗ DO NOT PAINT')}</div>`;
  };
  ['eT','eRH','eTs'].forEach(id => document.getElementById(id).addEventListener('input', run));
  run();
}

/* ===== DFT ===== */
function renderDft() {
  const v = LANG === 'vi';
  let h = `<div class="h2x">${v?'Chiều dày màng khô (DFT)':'Dry film thickness (DFT)'}</div>`;
  h += `<div class="seccard"><h3>🧮 ${v?'Đánh giá loạt số đo DFT (ISO 19840)':'Evaluate DFT readings (ISO 19840)'}</h3>
    <div class="inrow"><span class="lab">NDFT (µm)</span><input type="number" step="any" id="dN" value="240"></div>
    <div class="inrow"><span class="lab">${v?'DFT tối đa cho phép (µm, mặc định 3×NDFT)':'Max DFT (µm, default 3×NDFT)'}</span><input type="number" step="any" id="dM" placeholder="auto"></div>
    <div class="inrow" style="display:block"><span class="lab">${v?'Các số đo (cách nhau bằng dấu phẩy/khoảng trắng)':'Readings (comma/space separated)'}</span>
      <textarea class="wide" id="dR">245 252 238 230 199 260 247 215 241 236</textarea></div>
    <div id="dOut"></div>
    <div class="note">${v?'Quy tắc ISO 19840: trung bình ≥ NDFT; mọi giá trị ≥ 80% NDFT; ≤ max. Nhớ trừ hiệu chỉnh độ nhám (mặc định 25µm cho profile Trung bình) nếu máy chưa hiệu chuẩn trên bề mặt phun.':'ISO 19840: mean ≥ NDFT; all ≥ 80% NDFT; ≤ max. Subtract roughness correction (default 25µm, Medium) if not zeroed on blasted surface.'}</div></div>`;
  h += measureCard(v?'Cách đo DFT bằng máy đo từ tính (ISO 19840)':'Measuring DFT with magnetic gauge (ISO 19840)', SK.dft(),
    v?'1) Hiệu chuẩn: zero trên thép trần nhẵn rồi kiểm bằng lá chuẩn (foil) gần dải DFT cần đo; trên bề mặt phun hạt phải zero trên bề mặt phun chưa sơn hoặc trừ hiệu chỉnh nhám (mặc định 25µm). 2) Ấn đầu dò VUÔNG GÓC, giữ yên đến khi máy kêu; tránh mép/lỗ/góc <25mm. 3) Mỗi vị trí lấy ≥3 số đọc rải trong vòng tròn ~4cm, các vị trí rải ngẫu nhiên theo diện tích. 4) Nhập toàn bộ số đọc vào ô tính bên dưới để đánh giá tự động.'
     :'1) Calibrate: zero on smooth bare steel + verify with foil near target DFT; on blasted steel zero on blasted bare surface or subtract roughness correction (default 25µm). 2) Probe PERPENDICULAR, hold still; avoid edges/holes <25mm. 3) ≥3 readings per spot within ~4cm circle, spots randomized over area. 4) Paste all readings into the evaluator below.');
  h += `<div class="seccard"><h3>${esc(T(D.DFT.iso19840.title))}</h3>
    <ul class="tight">${D.DFT.iso19840.rules.map(r => `<li>${esc(T(r))}</li>`).join('')}</ul>
    <div class="note">${esc(T(D.DFT.iso19840.sampling))}</div>
    ${D.DFT.iso19840.quote ? `<div class="evidence"><div class="h">${v?'Dẫn chứng (nguyên văn)':'Evidence (verbatim)'}</div><div class="quote">"${esc(D.DFT.iso19840.quote)}"</div></div>` : ''}
    <div class="note">📎 ${esc(D.DFT.iso19840.ref)}</div>${D.DFT.iso19840.soft?softWarn():''}</div>`;
  h += `<div class="seccard"><h3>${esc(T(D.DFT.sspc.title))}</h3>
    <ul class="tight">${D.DFT.sspc.rules.map(r => `<li>${esc(T(r))}</li>`).join('')}</ul>
    <div class="note">📎 ${esc(D.DFT.sspc.ref)}</div>${D.DFT.sspc.soft?softWarn():''}</div>`;
  h += `<div class="seccard"><h3>🧮 ${v?'WFT cần phun để đạt NDFT':'WFT required for NDFT'}</h3>
    <div class="inrow"><span class="lab">NDFT (µm)</span><input type="number" step="any" id="wN" value="120"></div>
    <div class="inrow"><span class="lab">${v?'% thể tích chất rắn (VS%)':'Volume solids (%)'}</span><input type="number" step="any" id="wS" value="65"></div>
    <div class="inrow"><span class="lab">${v?'% pha loãng (theo thể tích)':'Thinner added (vol %)'}</span><input type="number" step="any" id="wT" value="0"></div>
    <div id="wOut"></div>
    <div class="note">WFT = NDFT / VS% × (100 + %thinner) — ISO 2808.</div></div>`;
  document.getElementById('tab-dft').innerHTML = h;

  const run = () => {
    const N = +document.getElementById('dN').value || 0;
    const Mraw = document.getElementById('dM').value;
    const M = Mraw ? +Mraw : 3 * N;
    const reads = (document.getElementById('dR').value.match(/[\d.]+/g) || []).map(Number).filter(x => x > 0);
    if (!reads.length || !N) { document.getElementById('dOut').innerHTML = ''; return; }
    const mean = reads.reduce((a, b) => a + b, 0) / reads.length;
    const min = Math.min(...reads), max = Math.max(...reads);
    const below80 = reads.filter(r => r < 0.8 * N);
    const band = reads.filter(r => r >= 0.8 * N && r < N);
    const okMean = mean >= N, ok80 = below80.length === 0, okMax = max <= M;
    const okBand = band.length < 0.2 * reads.length;
    const allOk = okMean && ok80 && okMax && okBand;
    document.getElementById('dOut').innerHTML = `
      <div class="res"><div class="lbl">${LANG==='vi'?'Kết quả':'Result'} (n = ${reads.length})</div><div class="big">
        a) ${LANG==='vi'?'Trung bình':'Mean'} = <b>${Math.round(mean)}µm</b> ${okMean?'≥':'<'} NDFT ${N}µm ${okMean?'✓':'✗'}<br>
        b) Min = ${min}µm (80% NDFT = ${Math.round(0.8*N)}µm) ${ok80?'✓':'✗ — '+below80.length+(LANG==='vi'?' điểm dưới 80%':' readings < 80%')}<br>
        c) ${LANG==='vi'?'Số điểm 80–100% NDFT':'Readings at 80–100% NDFT'} = ${band.length}/${reads.length} (${LANG==='vi'?'phải':'must be'} &lt; 20% = ${Math.round(0.2*reads.length*10)/10}) ${okBand?'✓':'✗'}<br>
        d) Max = ${max}µm (${LANG==='vi'?'giới hạn':'limit'} ${Math.round(M)}µm) ${okMax?'✓':'✗'}</div></div>
      <div class="verdict ${allOk?'pass':'fail'}">${allOk?(LANG==='vi'?'✓ ĐẠT theo ISO 19840:2012 mục 9 (a–d)':'✓ PASS per ISO 19840:2012 Cl.9'):(LANG==='vi'?'✗ KHÔNG ĐẠT':'✗ FAIL')}</div>` +
      (window.QCLog ? QCLog.saveButton('QC Sơn', 'DFT ISO 19840 (NDFT ' + N + 'µm)', allOk, 'n=' + reads.length + ' · TB=' + Math.round(mean) + 'µm · min=' + min + ' · max=' + max + ' · dải 80–100%: ' + band.length) : '');
  };
  ['dN','dM','dR'].forEach(id => document.getElementById(id).addEventListener('input', run));
  run();

  const wrun = () => {
    const N = +document.getElementById('wN').value || 0, S = +document.getElementById('wS').value || 1, Th = +document.getElementById('wT').value || 0;
    const wft = N / S * (100 + Th);
    document.getElementById('wOut').innerHTML = `<div class="res"><div class="lbl">WFT</div><div class="big">≈ <b>${Math.round(wft)} µm</b> ${LANG==='vi'?'màng ướt cần phun':'wet film required'}</div></div>`;
  };
  ['wN','wS','wT'].forEach(id => document.getElementById(id).addEventListener('input', wrun));
  wrun();
}

  h += D.TESTS.map(t => `<div class="seccard"><h3>${esc(T(t.name))}</h3>
    <div style="font-size:12px;font-weight:700;color:var(--brand2)">📎 ${esc(T(t.std))}</div>
    <div class="accept"><b>${v?'Tiêu chí chấp nhận':'Acceptance'}:</b> ${esc(T(t.crit))}</div>
    <div style="font-size:13.5px;margin-top:9px"><b>${v?'Cách làm':'Procedure'}:</b> ${esc(T(t.how))}</div>
    ${t.soft?softWarn():''}</div>`).join('');
  h += measureCard(v?'Cách làm cross-cut (ISO 2409)':'Cross-cut procedure (ISO 2409)', SK.crosscut(),
    v?'1) Chọn khoảng cách rạch theo DFT (ô tính bên dưới). 2) Rạch 6 đường xuyên màng tới nền, rồi 6 đường vuông góc tạo lưới 25 ô. 3) Chải nhẹ 5 lần chéo, dán băng keo chuẩn (ISO 2409), miết 90 giây. 4) Giật băng góc ~60° trong 0.5–1s. 5) So ảnh chuẩn: Class 0–1 thường ĐẠT. Lưu ý: test phá hủy — làm trên mẫu kèm hoặc vùng sửa được.'
     :'1) Spacing per DFT (tool below). 2) 6 cuts to substrate + 6 perpendicular → 25-square lattice. 3) Brush 5×, apply standard tape, rub 90s. 4) Pull at ~60° within 0.5–1s. 5) Compare chart: Class 0–1 usually PASS. Destructive — use test panel or repairable area.');
  h += measureCard(v?'Cách đo pull-off (ISO 4624)':'Pull-off procedure (ISO 4624)', SK.pulloff(),
    v?'1) Chà nhám nhẹ mặt sơn + đáy dolly Ø20mm, lau sạch. 2) Dán dolly bằng keo epoxy 2 thành phần, ép đều, chờ đóng rắn theo keo (thường 24h). 3) Cắt khía quanh dolly tới nền (nếu spec yêu cầu). 4) Lắp máy kéo thủy lực, kéo VUÔNG GÓC tăng đều ≤1MPa/s đến đứt. 5) Ghi MPa + kiểu phá hủy (A/B giữa các lớp, Y/Z ở keo) — phá hủy ở keo mà giá trị ≥ spec vẫn ĐẠT.'
     :'1) Abrade coating + Ø20mm dolly face, clean. 2) Glue with 2-part epoxy, cure (typ. 24h). 3) Score around dolly if specified. 4) Pull PERPENDICULAR, ≤1MPa/s to failure. 5) Record MPa + failure mode (adhesive/cohesive/glue).');
  /* cross-cut spacing calculator */
  h += `<div class="seccard"><h3>🧮 ${v?'Khoảng cách rạch cross-cut theo DFT':'Cross-cut spacing by DFT'}</h3>
    <div class="inrow"><span class="lab">DFT (µm)</span><input type="number" step="any" id="ccD" value="180"></div>
    <div id="ccOut"></div></div>`;
  document.getElementById('tab-test').innerHTML = h;
  const run = () => {
    const d = +document.getElementById('ccD').value || 0;
    let s, ok = true;
    if (d <= 60) s = '1 mm'; else if (d <= 120) s = '2 mm'; else if (d <= 250) s = '3 mm';
    else { s = LANG==='vi' ? 'KHÔNG dùng cross-cut — DFT > 250µm, dùng pull-off (ISO 4624)' : 'Do NOT use cross-cut — DFT > 250µm, use pull-off'; ok = false; }
    document.getElementById('ccOut').innerHTML = `<div class="res"><div class="lbl">ISO 2409</div><div class="big">${ok?(LANG==='vi'?'Khoảng cách rạch: ':'Spacing: ')+'<b>'+s+'</b>':s}</div></div>`;
  };
  document.getElementById('ccD').addEventListener('input', run); run();
}

    const l = +document.getElementById('znL').value || 0;
    const row = t > 6 ? TBL[0] : t > 3 ? TBL[1] : t > 1.5 ? TBL[2] : TBL[3];
    const okM = m >= row.mean, okL = l >= row.local;
    document.getElementById('znOut').innerHTML = `
      <div class="res"><div class="lbl">ISO 1461</div><div class="big">
        ${v?'Yêu cầu':'Required'}: ${v?'trung bình':'mean'} ≥ ${row.mean}µm · ${v?'cục bộ':'local'} ≥ ${row.local}µm<br>
        ${v?'Đo':'Measured'}: TB ${m}µm ${okM?'✓':'✗'} · ${v?'cục bộ':'local'} ${l}µm ${okL?'✓':'✗'}</div></div>
      <div class="verdict ${okM&&okL?'pass':'fail'}">${okM&&okL?(v?'✓ ĐẠT':'✓ PASS'):(v?'✗ KHÔNG ĐẠT':'✗ FAIL')}</div>` +
      (window.QCLog ? QCLog.saveButton('QC Coating', 'Mạ kẽm ISO 1461 (thép ' + t + 'mm)', okM && okL, 'TB ' + m + 'µm / cục bộ ' + l + 'µm — yêu cầu ' + row.mean + '/' + row.local) : '');
  };
  ['znT','znM','znL'].forEach(id => document.getElementById(id).addEventListener('input', run));
  run();
}

/* ===== CHECKLIST ===== */
const CK_KEY = 'son_ck_v1';
function ckState() { try { return JSON.parse(localStorage.getItem(CK_KEY)) || {}; } catch (e) { return {}; } }
function renderCK() {
  const v = LANG === 'vi';
  const st = ckState();
  let h = `<div class="ckbar">
    <button class="btn alt" id="ckReset">↺ ${v?'Làm mới':'Reset'}</button>
    <button class="btn" id="ckCopy">📋 ${v?'Copy báo cáo':'Copy report'}</button>
    <button class="btn" id="ckPrint">🖨 ${v?'In / PDF':'Print / PDF'}</button></div>`;
  D.CHECKLIST.forEach((ph, pi) => {
    const done = ph.items.filter((_, ii) => st[pi + '_' + ii]).length;
    h += `<div class="ckphase"><div class="ph">${ph.icon} ${esc(T(ph.phase))}<span class="pct">${done}/${ph.items.length}</span></div>
      ${ph.items.map((it, ii) => `
        <div class="ckitem ${st[pi+'_'+ii]?'done':''}" data-k="${pi}_${ii}">
          <div class="box">${st[pi+'_'+ii]?'✓':''}</div>
          <div class="tx">${esc(T(it.t))}<span class="rf">📎 ${esc(T(it.ref))}</span></div>
        </div>`).join('')}</div>`;
  });
  const el = document.getElementById('tab-ck');
  el.innerHTML = h;
  el.querySelectorAll('.ckitem').forEach(c => c.onclick = () => {
    const s = ckState(); s[c.dataset.k] = !s[c.dataset.k];
    localStorage.setItem(CK_KEY, JSON.stringify(s)); renderCK();
  });
  el.querySelector('#ckReset').onclick = () => { localStorage.removeItem(CK_KEY); renderCK(); };
  el.querySelector('#ckCopy').onclick = () => {
    const s = ckState();
    let txt = (v?'BÁO CÁO CHECKLIST QC SƠN':'PAINTING QC CHECKLIST REPORT') + ' — ' + new Date().toLocaleString() + '\n';
    D.CHECKLIST.forEach((ph, pi) => {
      txt += '\n## ' + T(ph.phase) + '\n';
      ph.items.forEach((it, ii) => txt += (s[pi+'_'+ii] ? '[x] ' : '[ ] ') + T(it.t) + ' (' + T(it.ref) + ')\n');
    });
    navigator.clipboard.writeText(txt).then(() => alert(v?'Đã copy!':'Copied!'));
  };
  el.querySelector('#ckPrint').onclick = () => {
    const s = ckState();
    if (window.QCReport) QCReport.print({
      module: 'QC Sơn', color: '#14532d',
      title: v ? 'BÁO CÁO CHECKLIST QC SƠN' : 'PAINTING QC CHECKLIST REPORT',
      groups: D.CHECKLIST.map((ph, pi) => ({
        name: T(ph.phase),
        items: ph.items.map((it, ii) => ({ ok: !!s[pi+'_'+ii], text: T(it.t), ref: T(it.ref) }))
      }))
    });
  };
}
