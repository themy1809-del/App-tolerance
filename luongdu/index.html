<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3f00">
<title>Lượng dư & Sai hỏng — Kết cấu thép</title>
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<style>
:root {
  --brand:#7c3f00; --brand2:#a35317; --soft:#fdf3e2;
  --ink:#1b2430; --muted:#5f6b7a; --line:#dfe5ec;
  --pass:#0f6e56; --fail:#aa4322; --warn:#8a5a00;
  --bg:#f8f5f0; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.appbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--brand),#5f2f00);color:#fff;padding:max(12px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.back{background:rgba(255,255,255,.18);color:#fff;text-decoration:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff}
h1{font-size:17px;margin:0;font-weight:800;line-height:1.15}
.sub{font-size:11px;opacity:.85}
.sp{flex:1}
.main{max-width:1180px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;padding:10px 16px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--brand);border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card h3{margin:0 0 6px;font-size:14px;color:var(--brand)}
.card .d{font-size:12px;color:var(--muted);line-height:1.45}
.card .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-top:6px}
.tag-weld{background:#fbeae2;color:var(--fail)}
.tag-thermal{background:#ffe9d6;color:var(--warn)}
.tag-mach{background:#e6f1fb;color:#0c447c}
.tag-form{background:#e3f6ee;color:var(--pass)}
.tag-cut{background:#f5e3ff;color:#5f4ab7}
.tag-distort{background:#fdf3e2;color:var(--warn)}
.tag-fit{background:#e6f1fb;color:#0c447c}
.tag-parent{background:#eee;color:var(--muted)}
.tag-consum{background:#fbe07d;color:#7c4a00}
.tag-pwht{background:#f5e3ff;color:#5f4ab7}
.sev-critical{background:#aa4322;color:#fff !important}
.sev-high{background:#ffd1c0;color:var(--fail)}
.sev-medium{background:#fff4d0;color:var(--warn)}
.sev-low{background:#e3f6ee;color:var(--pass)}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,45,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.mhead{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
.mhead h2{margin:0;font-size:17px;color:var(--brand)}
.mhead .x{background:none;border:1px solid var(--line);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:17px}
.mbody{padding:16px}
.sketch-box{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;padding:8px}
.sketch-box svg{width:100%;height:auto;display:block}
.formula{background:var(--soft);padding:10px 14px;border-radius:8px;font-family:Consolas,monospace;font-weight:700;color:var(--brand);font-size:15px;text-align:center;margin:12px 0;border:1px dashed var(--brand2)}
.calc{background:#f8f9fa;border-radius:8px;padding:14px;margin-top:12px}
.inp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.inp-row label{flex:1;font-size:13px;font-weight:600}
.inp-row input{width:120px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);text-align:right}
.result-box{background:#e3f6ee;border:2px solid var(--pass);border-radius:10px;padding:14px;margin-top:14px;text-align:center}
.result-val{font-size:24px;font-weight:900;color:var(--pass)}
.result-note{font-size:11px;color:var(--muted);margin-top:6px}
.ref{font-size:11px;color:var(--muted);padding:8px 12px;background:#f3f3f3;border-radius:6px;margin-top:10px}
.section-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 8px}
.list-item{display:flex;gap:8px;margin-bottom:6px;font-size:13.5px}
.list-item .bullet{color:var(--fail);font-weight:800;flex-shrink:0}
.list-item.ok .bullet{color:var(--pass)}
.symptom{background:#fbeae2;border-left:4px solid var(--fail);padding:10px 14px;border-radius:6px;font-size:13.5px;margin-bottom:14px}
@media (max-width:680px){
  .inp-row{flex-direction:column;align-items:stretch}
  .inp-row input{width:100%}
}
</style>
</head>
<body>
<header class="appbar">
  <a class="back" href="../" title="Trang chủ">←</a>
  <div class="logo">⚙</div>
  <div>
    <h1>Lượng dư & Sai hỏng</h1>
    <div class="sub">Allowance · Defect Root Cause Analysis</div>
  </div>
  <div class="sp"></div>
</header>

<main class="main">
  <div class="tabs">
    <button class="tab on" id="tabA" onclick="setTab('A')">📐 Tính lượng dư</button>
    <button class="tab" id="tabB" onclick="setTab('B')">🔍 Nguyên nhân sai hỏng</button>
  </div>
  <div id="content"></div>
</main>

<div id="modal"></div>

<script src="data.js?v=1"></script>
<script src="sketches.js?v=1"></script>
<script>
var TAB = 'A';
function setTab(t){
  TAB = t;
  document.getElementById('tabA').classList.toggle('on', t==='A');
  document.getElementById('tabB').classList.toggle('on', t==='B');
  render();
}
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  var c = document.getElementById('content');
  var html = '<div class="grid">';
  var items = TAB==='A' ? LD_DATA.allowance : LD_DATA.defects;
  items.forEach(function(it){
    if (TAB==='A'){
      html += '<div class="card" onclick="openCalc(\''+it.id+'\')">'
        + '<h3>'+ esc(it.title) +'</h3>'
        + '<div class="d">' + esc(it.desc) + '</div>'
        + '<span class="tag tag-'+it.cat+'">' + tagLabel(it.cat) + '</span>'
        + '</div>';
    } else {
      html += '<div class="card" onclick="openDefect(\''+it.id+'\')">'
        + '<h3>'+ esc(it.name) +'</h3>'
        + '<div class="d">' + esc(it.symptom) + '</div>'
        + '<span class="tag sev-'+it.severity+'">' + sevLabel(it.severity) + '</span> '
        + '<span class="tag tag-'+it.cat+'">' + tagLabel(it.cat) + '</span>'
        + '</div>';
    }
  });
  html += '</div>';
  c.innerHTML = html;
}
function tagLabel(c){
  return ({weld:'Hàn',thermal:'Nhiệt',mach:'Gia công',form:'Tạo hình',cut:'Cắt',distort:'Biến dạng',fit:'Lắp ghép',parent:'Vật liệu',consum:'Vật tư hàn',pwht:'PWHT'})[c] || c;
}
function sevLabel(s){
  return ({critical:'⚠ NGHIÊM TRỌNG',high:'CAO',medium:'TRUNG BÌNH',low:'THẤP'})[s] || s;
}
function openCalc(id){
  var item = LD_DATA.allowance.find(x=>x.id===id);
  if (!item) return;
  var st = window.LD_SK[item.sketch] ? '<div class="sketch-box">'+LD_SK[item.sketch]()+'</div>' : '';
  var inputs = item.vars.map(function(v,i){
    return '<div class="inp-row"><label>'+esc(v.label)+'</label><input id="v_'+v.key+'" type="number" step="any" value="'+v.def+'" oninput="recalc(\''+id+'\')"></div>';
  }).join('');
  var html = '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'
    + '<div class="mhead"><h2>📐 '+esc(item.title)+'</h2><button class="x" onclick="closeModal()">✕</button></div>'
    + '<div class="mbody">'
    + '<div class="symptom" style="background:#fdf3e2;border-color:var(--warn)">'+esc(item.desc)+'</div>'
    + st
    + '<div class="formula">'+esc(item.formula)+'</div>'
    + '<div class="calc"><div class="section-title">▸ Nhập giá trị thực</div>'+inputs
    + '<div id="result_'+id+'"></div></div>'
    + '<div class="ref">📖 ' + esc(item.ref) + '</div>'
    + '</div></div></div>';
  document.getElementById('modal').innerHTML = html;
  recalc(id);
}
function recalc(id){
  var item = LD_DATA.allowance.find(x=>x.id===id);
  if (!item) return;
  var vars = {};
  item.vars.forEach(function(v){
    var el = document.getElementById('v_'+v.key);
    vars[v.key] = el ? parseFloat(el.value)||0 : v.def;
  });
  try {
    var r = item.calc(vars);
    var val = typeof r.value === 'number' ? r.value.toFixed(3) : r.value;
    document.getElementById('result_'+id).innerHTML =
      '<div class="result-box"><div class="result-val">'+val+' '+esc(r.unit)+'</div>'
      + '<div class="result-note">'+esc(r.note||'')+'</div></div>';
  } catch(e){
    document.getElementById('result_'+id).innerHTML = '<div class="result-box" style="background:#fbeae2;border-color:var(--fail)"><div class="result-val" style="color:var(--fail)">Lỗi tính toán</div></div>';
  }
}
function openDefect(id){
  var item = LD_DATA.defects.find(x=>x.id===id);
  if (!item) return;
  var st = window.LD_SK[item.sketch] ? '<div class="sketch-box">'+LD_SK[item.sketch]()+'</div>' : '';
  var causes = item.causes.map(c=>'<div class="list-item"><span class="bullet">▸</span><span>'+esc(c)+'</span></div>').join('');
  var remedies = item.remedies.map(r=>'<div class="list-item ok"><span class="bullet">✓</span><span>'+esc(r)+'</span></div>').join('');
  var html = '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'
    + '<div class="mhead"><h2>🔍 '+esc(item.name)+'</h2><button class="x" onclick="closeModal()">✕</button></div>'
    + '<div class="mbody">'
    + '<span class="tag sev-'+item.severity+'">' + sevLabel(item.severity) + '</span>'
    + '<div class="symptom" style="margin-top:10px">'+esc(item.symptom)+'</div>'
    + st
    + '<div class="section-title">⚠ NGUYÊN NHÂN PHỔ BIẾN</div>'+causes
    + '<div class="section-title" style="margin-top:14px">✓ BIỆN PHÁP KHẮC PHỤC</div>'+remedies
    + '<div class="ref">📖 ' + esc(item.ref) + '</div>'
    + '</div></div></div>';
  document.getElementById('modal').innerHTML = html;
}
function closeModal(){ document.getElementById('modal').innerHTML = ''; }
render();
</script>
</body>
</html>
