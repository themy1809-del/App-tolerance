<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c3f00">
<title>Lượng dư & Sai hỏng — Kết cấu thép</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<style>
:root {
  --brand:#7c3f00; --brand2:#a35317; --soft:#fdf3e2;
  --ink:#1b2430; --muted:#5f6b7a; --line:#dfe5ec;
  --pass:#0f6e56; --fail:#aa4322; --warn:#8a5a00;
  --bg:#f8f5f0; --card:#fff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
.appbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--brand),#5f2f00);color:#fff;padding:max(12px,env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
.back{background:rgba(255,255,255,.18);color:#fff;text-decoration:none;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700}
.logo{width:36px;height:36px;border-radius:10px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff}
h1{font-size:17px;margin:0;font-weight:800;line-height:1.15}
.sub{font-size:11px;opacity:.85}
.sp{flex:1}
.main{max-width:1180px;margin:0 auto;padding:14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:2px solid var(--line)}
.tab{background:none;border:0;padding:10px 16px;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tab.on{color:var(--brand);border-color:var(--brand)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08)}
.card h3{margin:0 0 6px;font-size:14px;color:var(--brand)}
.card .d{font-size:12px;color:var(--muted);line-height:1.45}
.card .tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;margin-top:6px}
.tag-weld{background:#fbeae2;color:var(--fail)}
.tag-thermal{background:#ffe9d6;color:var(--warn)}
.tag-mach{background:#e6f1fb;color:#0c447c}
.tag-form{background:#e3f6ee;color:var(--pass)}
.tag-cut{background:#f5e3ff;color:#5f4ab7}
.tag-distort{background:#fdf3e2;color:var(--warn)}
.tag-fit{background:#e6f1fb;color:#0c447c}
.tag-parent{background:#eee;color:var(--muted)}
.tag-consum{background:#fbe07d;color:#7c4a00}
.tag-pwht{background:#f5e3ff;color:#5f4ab7}
.sev-critical{background:#aa4322;color:#fff !important}
.sev-high{background:#ffd1c0;color:var(--fail)}
.sev-medium{background:#fff4d0;color:var(--warn)}
.sev-low{background:#e3f6ee;color:var(--pass)}
.modal-bg{position:fixed;inset:0;background:rgba(20,30,45,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.mhead{padding:16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
.mhead h2{margin:0;font-size:17px;color:var(--brand)}
.mhead .x{background:none;border:1px solid var(--line);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:17px}
.mbody{padding:16px}
.sketch-box{background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:14px;padding:8px}
.sketch-box svg{width:100%;height:auto;display:block}
.formula{background:var(--soft);padding:10px 14px;border-radius:8px;font-family:Consolas,monospace;font-weight:700;color:var(--brand);font-size:15px;text-align:center;margin:12px 0;border:1px dashed var(--brand2)}
.calc{background:#f8f9fa;border-radius:8px;padding:14px;margin-top:12px}
.inp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.inp-row label{flex:1;font-size:13px;font-weight:600}
.inp-row input{width:120px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);text-align:right}
.result-box{background:#e3f6ee;border:2px solid var(--pass);border-radius:10px;padding:14px;margin-top:14px;text-align:center}
.result-val{font-size:24px;font-weight:900;color:var(--pass)}
.result-note{font-size:11px;color:var(--muted);margin-top:6px}
.ref{font-size:11px;color:var(--muted);padding:8px 12px;background:#f3f3f3;border-radius:6px;margin-top:10px}
.section-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:14px 0 8px}
.list-item{display:flex;gap:8px;margin-bottom:6px;font-size:13.5px}
.list-item .bullet{color:var(--fail);font-weight:800;flex-shrink:0}
.list-item.ok .bullet{color:var(--pass)}
.symptom{background:#fbeae2;border-left:4px solid var(--fail);padding:10px 14px;border-radius:6px;font-size:13.5px;margin-bottom:14px}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gal-card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.18s;display:flex;flex-direction:column}
.gal-card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.1)}
.gal-thumb{position:relative;height:180px;background:#1b2430;overflow:hidden;display:flex;align-items:center;justify-content:center}
.gal-thumb img{width:100%;height:100%;object-fit:cover}
.gal-err{color:#fff;text-align:center;padding:14px;font-size:13px}
.gal-err span{font-size:11px;opacity:.7;display:block;margin-top:4px}
.gal-info{padding:12px 14px}
.gal-cat{font-size:10.5px;font-weight:800;color:var(--brand);letter-spacing:.4px;margin-bottom:4px}
.gal-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:4px;line-height:1.3}
.gal-desc{font-size:12px;color:var(--muted);line-height:1.45}
.gal-placeholder{display:none;flex-direction:column;align-items:center;justify-content:center;color:#cdd6df;width:100%;height:100%;background:#1b2430}
.search-btn{display:inline-block;padding:5px 9px;border-radius:6px;font-size:10.5px;font-weight:700;text-decoration:none;letter-spacing:.2px;transition:.15s}
.search-btn.google{background:#4285f4;color:#fff}
.search-btn.bing{background:#008373;color:#fff}
.search-btn.ddg{background:#de5833;color:#fff}
.search-btn:hover{opacity:.85;transform:translateY(-1px)}

.chip{background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.chip-rc{background:#fff;border:1px solid var(--line);padding:7px 13px;border-radius:20px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.chip-rc.on{background:#0c447c;color:#fff;border-color:#0c447c}
.filter-label{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px}
.rc-badge{display:inline-block;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:800;letter-spacing:.3px;margin-right:4px;margin-top:4px;color:#fff}
.rc-man{background:#aa4322}.rc-machine{background:#5f4ab7}
.rc-material{background:#854f0b}.rc-method{background:#0c447c}
.rc-measurement{background:#0f6e56}.rc-env{background:#3b6d11}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ref-img{display:block;margin:12px 0;text-align:center}
.ref-img img{max-width:100%;max-height:280px;border:1px solid var(--line);border-radius:8px}
.ref-img a{color:var(--brand);font-size:11px;display:block;margin-top:4px}
@media (max-width:680px){
  .inp-row{flex-direction:column;align-items:stretch}
  .inp-row input{width:100%}
}

.real-photo-box{background:#1b2430;border-radius:10px;overflow:hidden;margin-bottom:14px;min-height:200px;position:relative}
.real-photo-img{width:100%;max-height:420px;object-fit:cover;display:block}
.real-photo-empty{display:none;flex-direction:column;align-items:center;justify-content:center;padding:30px 20px;background:#f3f3f3;border-radius:10px;text-align:center}
</style>

<body>
<header class="appbar">
  <a class="back" href="../" title="Trang chủ">←</a>
  <div class="logo">⚙</div>
  <div>
    <h1>Lượng dư & Sai hỏng</h1>
    <div class="sub">Allowance · Defect Root Cause Analysis</div>
  </div>
  <div class="sp"></div>
</header>

<main class="main">
  <div style="margin-bottom:14px"><input id="q" type="search" placeholder="🔍 Tìm: cháy chân, H2, preheat, kerf, bend, distortion..." style="width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;font-family:inherit;background:#fff" oninput="render()"></div>
  <div class="tabs">
    <button class="tab on" id="tabA" onclick="setTab('A')">📐 Tính lượng dư</button>
    <button class="tab" id="tabB" onclick="setTab('B')">🔍 Sai hỏng (45)</button>
    <button class="tab" id="tabC" onclick="setTab('C')">📚 Thư viện 5M+1E</button>
    <button class="tab" id="tabD" onclick="setTab('D')">📸 Ảnh thật (39)</button>
    <button class="tab" id="tabE" onclick="setTab('E')">📷 Đo ảnh</button>
    <button class="tab" id="tabF" onclick="setTab('F')">🗂 ITP</button>
  </div>
  <div id="galFilter" style="display:none;gap:6px;flex-wrap:wrap;margin-bottom:12px">
    <button class="chip on" data-gal="all" onclick="setGal('all')">Tất cả · 39</button>
    <button class="chip" data-gal="weld" onclick="setGal('weld')">🔥 Hàn · 15</button>
    <button class="chip" data-gal="paint" onclick="setGal('paint')">🎨 Sơn · 11</button>
    <button class="chip" data-gal="dim" onclick="setGal('dim')">📐 Kích thước · 7</button>
    <button class="chip" data-gal="nde" onclick="setGal('nde')">📡 NDE · 6</button>
  </div>
  <div id="catFilter" style="display:none;flex-direction:column;gap:8px;margin-bottom:12px">
    <div>
      <div class="filter-label">Theo loại lỗi:</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="chip on" data-cat="all" onclick="setCat('all')">Tất cả · 45</button>
        <button class="chip" data-cat="weld" onclick="setCat('weld')">🔥 Hàn · 11</button>
        <button class="chip" data-cat="dim" onclick="setCat('dim')">📐 Kích thước · 9</button>
        <button class="chip" data-cat="paint" onclick="setCat('paint')">🎨 Sơn · 15</button>
        <button class="chip" data-cat="other" onclick="setCat('other')">⚡ Khác · 10</button>
      </div>
    </div>
    <div>
      <div class="filter-label">Theo nguyên nhân gốc (Ishikawa 5M+1E):</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="chip-rc on" data-rc="all" onclick="setRC('all')">Tất cả</button>
        <button class="chip-rc" data-rc="man" onclick="setRC('man')">👷 CON NGƯỜI · 10</button>
        <button class="chip-rc" data-rc="machine" onclick="setRC('machine')">⚙️ MÁY MÓC · 6</button>
        <button class="chip-rc" data-rc="material" onclick="setRC('material')">📦 VẬT LIỆU · 6</button>
        <button class="chip-rc" data-rc="method" onclick="setRC('method')">📋 PHƯƠNG PHÁP · 16</button>
        <button class="chip-rc" data-rc="measurement" onclick="setRC('measurement')">📏 ĐO LƯỜNG · 3</button>
        <button class="chip-rc" data-rc="env" onclick="setRC('env')">🌦️ MÔI TRƯỜNG · 4</button>
      </div>
    </div>
    <div>
      <div class="filter-label">Theo mức độ nghiêm trọng:</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="chip-rc on" data-sev="all" onclick="setSev('all')">Tất cả</button>
        <button class="chip-rc" data-sev="critical" onclick="setSev('critical')">⚠ NGHIÊM TRỌNG</button>
        <button class="chip-rc" data-sev="high" onclick="setSev('high')">CAO</button>
        <button class="chip-rc" data-sev="medium" onclick="setSev('medium')">TRUNG BÌNH</button>
        <button class="chip-rc" data-sev="low" onclick="setSev('low')">THẤP</button>
      </div>
    </div>
  </div>
  <div id="content"></div>
  <div id="photoWrap" style="display:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px"></div>
  <div id="itpWrap" style="display:none"></div>
</main>

<script>
var TAB = 'A';
var CAT = 'all', RC = 'all', SEV = 'all';
function setSev(s){
  SEV = s;
  document.querySelectorAll('.chip-rc[data-sev]').forEach(b => b.classList.toggle('on', b.dataset.sev===s));
  render();
}
function setTab(t){
  TAB = t;
  ['A','B','C','D','E','F'].forEach(x => { var el=document.getElementById('tab'+x); if(el) el.classList.toggle('on', t===x); });
  document.getElementById('catFilter').style.display = t==='B' ? 'flex' : 'none';
  document.getElementById('galFilter').style.display = t==='D' ? 'flex' : 'none';
  var pw = document.getElementById('photoWrap'), ct = document.getElementById('content'), iw = document.getElementById('itpWrap');
  pw.style.display='none'; iw.style.display='none'; ct.style.display='';
  if (t==='E') {
    ct.style.display='none'; pw.style.display='block';
    if (window.PhotoTool) PhotoTool.mount(pw, { key: 'ld_photos_v1' });
    return;
  }
  if (t==='F') {
    ct.style.display='none'; iw.style.display='block';
    if (window.QCITP && window.ITP_DATA) QCITP.mount(iw, ITP_DATA.luongdu, { color: '#5f4ab7' });
    return;
  }
  render();
}
var GAL = 'all';
function setGal(g){
  GAL = g;
  document.querySelectorAll('.chip[data-gal]').forEach(b => b.classList.toggle('on', b.dataset.gal===g));
  render();
}
function setCat(c){
  CAT = c;
  document.querySelectorAll('.chip[data-cat]').forEach(b => b.classList.toggle('on', b.dataset.cat===c));
  render();
}
function setRC(rc){
  RC = rc;
  document.querySelectorAll('.chip-rc[data-rc]').forEach(b => b.classList.toggle('on', b.dataset.rc===rc));
  render();
}
function rcLabel(rc){
  return ({man:'👷 CON NGƯỜI',machine:'⚙️ MÁY MÓC',material:'📦 VẬT LIỆU',method:'📋 PHƯƠNG PHÁP',measurement:'📏 ĐO LƯỜNG',env:'🌦️ MÔI TRƯỜNG'})[rc] || rc;
}
function esc(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function render(){
  var c = document.getElementById('content');
  if (TAB === 'C') { renderLib(); return; }
  if (TAB === 'D') { renderGallery(); return; }
  var html = '<div class="grid">';
  var items = TAB==='A' ? LD_DATA.allowance : LD_DATA.defects;
  if (TAB === 'B') {
    if (CAT !== 'all') {
      if (CAT === 'other') items = items.filter(it => !['weld','dim','paint'].includes(it.cat));
      else items = items.filter(it => it.cat === CAT);
    }
    if (RC !== 'all') items = items.filter(it => it.rootCause === RC);
    if (SEV !== 'all') items = items.filter(it => it.severity === SEV);
    var sevOrder = {critical:0, high:1, medium:2, low:3};
    items = items.slice().sort(function(a,b){ return (sevOrder[a.severity]??9) - (sevOrder[b.severity]??9); });
  }
  var q = ((document.getElementById('q')||{}).value || '').toLowerCase().trim();
  var norm = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[đĐ]/g,'d').toLowerCase();
  if (q) {
    var qn = norm(q);
    items = items.filter(function(it){
      var hay = JSON.stringify(it);
      return norm(hay).indexOf(qn) >= 0;
    });
  }
  if (items.length === 0) { c.innerHTML = '<div style="text-align:center;padding:40px;color:var(--muted)">🔍 Không tìm thấy "' + esc(q) + '"</div>'; return; }
  items.forEach(function(it){
    if (TAB==='A'){
      html += '<div class="card" onclick="openCalc(\''+it.id+'\')">'
        + '<h3>'+ esc(it.title) +'</h3>'
        + '<div class="d">' + esc(it.desc) + '</div>'
        + '<span class="tag tag-'+it.cat+'">' + tagLabel(it.cat) + '</span>'
        + '</div>';
    } else {
      var rcb = it.rootCause ? '<span class="rc-badge rc-'+it.rootCause+'">'+rcLabel(it.rootCause).replace(/^[^A-Za-z]*/,'')+'</span>' : '';
      html += '<div class="card" onclick="openDefect(\''+it.id+'\')">'
        + '<h3>'+ esc(it.name) +'</h3>'
        + '<div class="d">' + esc(it.symptom) + '</div>'
        + rcb
        + '<span class="tag sev-'+it.severity+'">' + sevLabel(it.severity) + '</span> '
        + '<span class="tag tag-'+it.cat+'">' + tagLabel(it.cat) + '</span>'
        + '</div>';
    }
  });
  html += '</div>';
  c.innerHTML = html;
}
function tagLabel(c){
  return ({weld:'Hàn',thermal:'Nhiệt',mach:'Gia công',form:'Tạo hình',cut:'Cắt',distort:'Biến dạng',fit:'Lắp ghép',parent:'Vật liệu',consum:'Vật tư hàn',pwht:'PWHT'})[c] || c;
}
function sevLabel(s){
  return ({critical:'⚠ NGHIÊM TRỌNG',high:'CAO',medium:'TRUNG BÌNH',low:'THẤP'})[s] || s;
}
function openCalc(id){
  var item = LD_DATA.allowance.find(x=>x.id===id);
  if (!item) return;
  var st = window.LD_SK[item.sketch] ? '<div class="sketch-box">'+LD_SK[item.sketch]()+'</div>' : '';
  var refImg = item.refImg ? '<div class="ref-img"><img src="'+esc(item.refImg)+'" loading="lazy" alt="ref" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><a href="'+esc(item.refImg)+'" target="_blank">📸 Xem ảnh thật trên web (Wikimedia Commons)</a></div>' : '';
  var inputs = item.vars.map(function(v,i){
    return '<div class="inp-row"><label>'+esc(v.label)+'</label><input id="v_'+v.key+'" type="number" step="any" value="'+v.def+'" oninput="recalc(\''+id+'\')"></div>';
  }).join('');
  var html = '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'
    + '<div class="mhead"><h2>📐 '+esc(item.title)+'</h2><button class="x" onclick="closeModal()">✕</button></div>'
    + '<div class="mbody">'
    + '<div class="symptom" style="background:#fdf3e2;border-color:var(--warn)">'+esc(item.desc)+'</div>'
    + st
    + '<div class="formula">'+esc(item.formula)+'</div>'
    + '<div class="calc"><div class="section-title">▸ Nhập giá trị thực</div>'+inputs
    + '<div id="result_'+id+'"></div></div>'
    + '<div class="ref">📖 ' + esc(item.ref) + '</div>'
    + '</div></div></div>';
  document.getElementById('modal').innerHTML = html;
  recalc(id);
}
function recalc(id){
  var item = LD_DATA.allowance.find(x=>x.id===id);
  if (!item) return;
  var vars = {};
  item.vars.forEach(function(v){
    var el = document.getElementById('v_'+v.key);
    vars[v.key] = el ? parseFloat(el.value)||0 : v.def;
  });
  try {
    var r = item.calc(vars);
    var val = typeof r.value === 'number' ? r.value.toFixed(3) : r.value;
    document.getElementById('result_'+id).innerHTML =
      '<div class="result-box"><div class="result-val">'+val+' '+esc(r.unit)+'</div>'
      + '<div class="result-note">'+esc(r.note||'')+'</div></div>';
  } catch(e){
    document.getElementById('result_'+id).innerHTML = '<div class="result-box" style="background:#fbeae2;border-color:var(--fail)"><div class="result-val" style="color:var(--fail)">Lỗi tính toán</div></div>';
  }
}
function openDefect(id){
  var item = LD_DATA.defects.find(x=>x.id===id);
  if (!item) return;
  var st = window.LD_SK[item.sketch] ? '<div class="sketch-box">'+LD_SK[item.sketch]()+'</div>' : '';
  var refImg = item.refImg ? '<div class="ref-img"><img src="'+esc(item.refImg)+'" loading="lazy" alt="ref" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'"><a href="'+esc(item.refImg)+'" target="_blank">📸 Xem ảnh thật trên web (Wikimedia Commons)</a></div>' : '';
  var causes = item.causes.map(c=>'<div class="list-item"><span class="bullet">▸</span><span>'+esc(c)+'</span></div>').join('');
  var remedies = item.remedies.map(r=>'<div class="list-item ok"><span class="bullet">✓</span><span>'+esc(r)+'</span></div>').join('');
  var html = '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">'
    + '<div class="mhead"><h2>🔍 '+esc(item.name)+'</h2><button class="x" onclick="closeModal()">✕</button></div>'
    + '<div class="mbody">'
    + '<span class="tag sev-'+item.severity+'">' + sevLabel(item.severity) + '</span> '
    + (item.rootCause ? '<span class="rc-badge rc-'+item.rootCause+'" style="font-size:11px;padding:5px 11px">NGUYÊN NHÂN GỐC: '+rcLabel(item.rootCause)+'</span>' : '')
    + '<div class="symptom" style="margin-top:10px">'+esc(item.symptom)+'</div>'
    + st
    + buildRealPhoto(item)
    + (item.acceptance ? buildAcceptance(item.acceptance) : '')
    + '<div class="section-title">⚠ NGUYÊN NHÂN PHỔ BIẾN</div>'+causes
    + '<div class="section-title" style="margin-top:14px">✓ BIỆN PHÁP KHẮC PHỤC</div>'+remedies
    + (item.cat==='weld' || item.cat==='consum'
        ? '<a href="../han/" style="display:block;text-align:center;margin-top:14px;padding:12px;background:#7c2d12;color:#fff;border-radius:10px;font-weight:700;text-decoration:none">🧮 Đánh giá Đạt/Không đạt theo AWS D1.1 / ISO 5817 → mở module QC Hàn</a>'
        : '')
    + (item.cat==='paint'
        ? '<a href="../son/" style="display:block;text-align:center;margin-top:14px;padding:12px;background:#14532d;color:#fff;border-radius:10px;font-weight:700;text-decoration:none">🎨 Tiêu chí nghiệm thu sơn (DFT, bề mặt, môi trường) → mở module QC Sơn</a>'
        : '')
    + '<button onclick="copyNCR(\''+item.id+'\')" style="display:block;width:100%;text-align:center;margin-top:10px;padding:12px;background:#0c447c;color:#fff;border:0;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit">📋 Tạo NCR nháp (copy vào clipboard)</button>'
    + '<div class="ref">📖 ' + esc(item.ref) + '</div>'
    + '</div></div></div>';
  document.getElementById('modal').innerHTML = html;
}
function copyNCR(id){
  var item = LD_DATA.defects.find(x=>x.id===id);
  if (!item) return;
  var acc = item.acceptance || {};
  var accTable = (acc.table||[]).map(function(r){ return '  - ' + r[0] + ': ' + r[1]; }).join('\n');
  var txt = [
    '=== NCR NHÁP (Non-Conformance Report) ===',
    'Ngày lập: ' + new Date().toLocaleDateString('vi-VN'),
    'Hạng mục / Mã cấu kiện: ........................',
    'Vị trí phát hiện: ........................',
    '',
    '1. MÔ TẢ SỰ KHÔNG PHÙ HỢP',
    '   Loại lỗi: ' + item.name + ' (' + sevLabel(item.severity) + ')',
    '   Hiện tượng: ' + item.symptom,
    '   Giá trị đo thực tế: ........................',
    '',
    '2. TIÊU CHUẨN THAM CHIẾU & TIÊU CHÍ CHẤP NHẬN',
    '   ' + (acc.ref || item.ref),
    accTable ? accTable : '   Chấp nhận: ' + (acc.ok || 'theo spec dự án'),
    '   Không chấp nhận: ' + (acc.notok || 'theo spec dự án'),
    '',
    '3. NGUYÊN NHÂN (sơ bộ — Ishikawa ' + (item.rootCause ? rcLabel(item.rootCause) : '') + ')',
    (item.causes||[]).slice(0,3).map(function(c){return '   - ' + c;}).join('\n'),
    '',
    '4. BIỆN PHÁP XỬ LÝ ĐỀ XUẤT',
    (item.remedies||[]).slice(0,3).map(function(r){return '   - ' + r;}).join('\n'),
    '',
    '5. YÊU CẦU KIỂM TRA LẠI SAU XỬ LÝ: 100% bằng phương pháp ban đầu',
    'Người lập: ............  QC duyệt: ............  Khách hàng/TVGS: ............'
  ].join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function(){
    alert('✓ Đã copy NCR nháp — dán vào biểu mẫu/email.');
  }).catch(function(){
    prompt('Copy thủ công:', txt);
  });
}
function renderLib(){
  var c = document.getElementById('content');
  var html = '<div style="background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:14px"><h3 style="margin:0 0 10px;color:var(--brand)">🎯 Khung Ishikawa 5M+1E — Phân tích nguyên nhân gốc chuyên sâu</h3><p style="margin:0;font-size:13px;color:var(--muted);line-height:1.6">Mỗi nhóm nguyên nhân được phân tích đầy đủ: <strong>định nghĩa · sub-factors · lỗi thường gặp · công cụ phòng ngừa · biện pháp kiểm soát · ISO references · KPI tracking</strong>. Click vào mỗi card để xem chi tiết.</p></div>';
  html += '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(320px,1fr))">';
  LD_LIB.forEach(function(cat){
    html += '<div class="card" style="border-top:5px solid '+cat.color+'" onclick="openLib(\''+cat.id+'\')">'
      + '<div style="font-size:32px;line-height:1;margin-bottom:8px">'+cat.icon+'</div>'
      + '<h3 style="color:'+cat.color+'">'+esc(cat.name)+'</h3>'
      + '<div class="d" style="margin:6px 0">'+esc(cat.short)+'</div>'
      + '<div style="display:flex;gap:10px;font-size:11px;color:var(--muted);margin-top:10px">'
      + '<span>📌 '+cat.subFactors.length+' sub-factors</span>'
      + '<span>✓ '+cat.prevention.length+' tools</span>'
      + '<span>📖 '+cat.isoRefs.length+' ISO</span>'
      + '</div></div>';
  });
  html += '</div>';
  c.innerHTML = html;
}
function openLib(id){
  var cat = LD_LIB.find(x=>x.id===id);
  if (!cat) return;
  var subF = cat.subFactors.map(s => '<div class="list-item"><span class="bullet" style="color:'+cat.color+'">▸</span><span><strong>'+esc(s.name)+'</strong> — '+esc(s.desc)+'</span></div>').join('');
  var fails = cat.commonFailures.map(f => '<div class="list-item"><span class="bullet">✗</span><span>'+esc(f)+'</span></div>').join('');
  var prev = cat.prevention.map(p => '<div style="background:#e3f6ee;border-left:4px solid var(--pass);padding:10px 14px;border-radius:6px;margin-bottom:8px"><strong style="color:var(--pass)">'+esc(p.tool)+'</strong><div style="font-size:13px;margin-top:3px">'+esc(p.desc)+'</div><div style="font-size:11px;color:var(--muted);margin-top:4px">📖 '+esc(p.ref)+'</div></div>').join('');
  var ctrls = cat.controls.map(c => '<div class="list-item ok"><span class="bullet">✓</span><span>'+esc(c)+'</span></div>').join('');
  var isos = cat.isoRefs.map(i => '<tr><td style="padding:6px 10px;font-weight:700;color:var(--brand);white-space:nowrap">'+esc(i.code)+'</td><td style="padding:6px 10px;font-size:12.5px">'+esc(i.title)+'</td></tr>').join('');
  var kpis = cat.kpis.map(k => '<div class="list-item"><span class="bullet" style="color:#5f4ab7">📊</span><span>'+esc(k)+'</span></div>').join('');
  var html = '<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal" style="max-width:880px">'
    + '<div class="mhead" style="background:'+cat.color+';color:#fff;border-bottom-color:'+cat.color+'">'
    + '<h2 style="color:#fff;display:flex;align-items:center;gap:10px">'+cat.icon+' '+esc(cat.name)+'</h2>'
    + '<button class="x" style="background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.3);color:#fff" onclick="closeModal()">✕</button>'
    + '</div>'
    + '<div class="mbody">'
    + '<div style="background:#f3f3f3;padding:14px;border-radius:8px;margin-bottom:14px;font-size:13.5px;line-height:1.6">'+esc(cat.definition)+'</div>'
    + '<div class="section-title">📌 SUB-FACTORS (yếu tố chi tiết)</div>'+subF
    + '<div class="section-title" style="margin-top:16px">✗ LỖI THƯỜNG GẶP TRONG XƯỞNG</div>'+fails
    + '<div class="section-title" style="margin-top:16px">🛡 CÔNG CỤ PHÒNG NGỪA (Prevention)</div>'+prev
    + '<div class="section-title" style="margin-top:16px">✓ BIỆN PHÁP KIỂM SOÁT (Controls)</div>'+ctrls
    + '<div class="section-title" style="margin-top:16px">📊 KPI THEO DÕI</div>'+kpis
    + '<div class="section-title" style="margin-top:16px">📖 ISO / CHUẨN THAM CHIẾU</div>'
    + '<table style="width:100%;border-collapse:collapse;background:#fafafa;border-radius:8px;overflow:hidden">'+isos+'</table>'
    + '</div></div></div>';
  document.getElementById('modal').innerHTML = html;
}
function renderGallery(){
  var c = document.getElementById('content');
  var items = window.LD_GALLERY || [];
  if (GAL !== 'all') items = items.filter(g => g.cat === GAL);
  var q = ((document.getElementById('q')||{}).value || '').toLowerCase().trim();
  if (q) {
    var qn = q.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d').toLowerCase();
    items = items.filter(g => (g.title+g.desc+g.query+g.id).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[đĐ]/g,'d').toLowerCase().indexOf(qn) >= 0);
  }
  var html = '<div style="background:#fff4d0;border:1px solid var(--warn);border-radius:12px;padding:14px;margin-bottom:14px;font-size:13.5px;color:var(--warn)">💡 <strong>Cách dùng:</strong> Click "🔍 Google Images" hoặc "🔍 Bing Images" để mở browser search với query có sẵn → save ảnh ưng ý về folder <code>luongdu/images/&lt;id&gt;.jpg</code> → app tự dùng làm thumbnail. <a href="images/README.md" target="_blank" style="color:var(--brand)">📖 Hướng dẫn chi tiết</a></div>';
  if (items.length === 0) {
    html += '<div style="text-align:center;padding:40px;color:var(--muted)">🔍 Không tìm thấy</div>';
  } else {
    html += '<div class="gallery-grid">';
    items.forEach(function(g){
      var localImg = 'images/'+g.id+'.jpg';
      html += '<div class="gal-card">'
        + '<div class="gal-thumb">'
        + '<img src="' + esc(localImg) + '" loading="lazy" alt="' + esc(g.title) + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
        + '<div class="gal-placeholder" style="display:none">'
        + '<div style="font-size:36px;margin-bottom:8px">📷</div>'
        + '<div style="font-size:11.5px;text-align:center;padding:0 10px;line-height:1.4">Chưa có ảnh thật<br><span style="font-size:10px;opacity:.7">Click button dưới để tìm</span></div>'
        + '</div>'
        + '</div>'
        + '<div class="gal-info">'
        + '<div class="gal-cat">' + ({weld:"🔥 HÀN",paint:"🎨 SƠN",dim:"📐 KÍCH THƯỚC",nde:"📡 NDE"}[g.cat]||g.cat) + '</div>'
        + '<div class="gal-title">' + esc(g.title) + '</div>'
        + '<div class="gal-desc">' + esc(g.desc) + '</div>'
        + '<div style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap">'
        + '<a class="search-btn google" href="https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(g.query) + '" target="_blank" rel="noopener">🔍 Google</a>'
        + '<a class="search-btn bing" href="https://www.bing.com/images/search?q=' + encodeURIComponent(g.query) + '" target="_blank" rel="noopener">🔍 Bing</a>'
        + '<a class="search-btn ddg" href="https://duckduckgo.com/?iax=images&ia=images&q=' + encodeURIComponent(g.query) + '" target="_blank" rel="noopener">🔍 DDG</a>'
        + '</div>'
        + '<div style="margin-top:6px;font-size:10.5px;color:var(--muted)">📁 Save: <code style="font-size:10px">' + esc(g.id) + '.jpg</code></div>'
        + '</div></div>';
    });
    html += '</div>';
  }
  c.innerHTML = html;
}


function buildRealPhoto(item){
  // Try multiple id variants to find gallery entry
  var galMap = (window.LD_GALLERY||[]).reduce(function(m,g){ m[g.id]=g; return m; }, {});
  var ids = [item.id, item.id.replace('paint-','p-').replace('dim-','d-')];
  var g = null;
  for (var i=0;i<ids.length;i++){ if (galMap[ids[i]]){ g = galMap[ids[i]]; break; } }
  // Fallback: build query from English title if available
  var query = g ? g.query : (item.id.replace(/-/g,' ') + ' defect steel weld');
  var localId = g ? g.id : item.id;
  var localImg = 'images/' + localId + '.jpg';

  return '<div class="section-title">📸 ẢNH THỰC TẾ</div>'
    + '<div class="real-photo-box">'
    + '<img class="real-photo-img" src="' + esc(localImg) + '" loading="lazy" alt="real photo" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">'
    + '<div class="real-photo-empty" style="display:none">'
    + '<div style="font-size:42px;margin-bottom:10px">📷</div>'
    + '<div style="font-weight:700;color:var(--ink);margin-bottom:4px">Chưa có ảnh local</div>'
    + '<div style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Click để xem ảnh thực tế trên web → save với tên <code>' + esc(localId) + '.jpg</code> vào folder <code>luongdu/images/</code></div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">'
    + '<a class="search-btn google" href="https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(query) + '" target="_blank" rel="noopener">🔍 Google Images</a>'
    + '<a class="search-btn bing" href="https://www.bing.com/images/search?q=' + encodeURIComponent(query) + '" target="_blank" rel="noopener">🔍 Bing Images</a>'
    + '<a class="search-btn ddg" href="https://duckduckgo.com/?iax=images&ia=images&q=' + encodeURIComponent(query) + '" target="_blank" rel="noopener">🔍 DuckDuckGo</a>'
    + '</div>'
    + '</div>'
    + '</div>';
}

function buildAcceptance(a){
  var rowColors = {pass:'#0f6e56', warn:'#8a5a00', fail:'#aa4322'};
  var rowBg = {pass:'#e3f6ee', warn:'#fdf3e2', fail:'#fbeae2'};
  var rowIcon = {pass:'✓', warn:'⚠', fail:'✗'};
  var rows = (a.table||[]).map(function(r){
    var s = r[2] || 'warn';
    return '<tr>'
      + '<td style="padding:8px 10px;font-weight:700;background:' + rowBg[s] + ';border-left:4px solid ' + rowColors[s] + ';font-size:13px">' + rowIcon[s] + ' ' + esc(r[0]) + '</td>'
      + '<td style="padding:8px 10px;font-size:13px;color:#1b2430">' + esc(r[1]) + '</td>'
      + '</tr>';
  }).join('');
  return '<div class="section-title">🎯 TIÊU CHÍ CHẤP NHẬN / TỪ CHỐI</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px">'
    + '<div style="background:#e3f6ee;border:2px solid #0f6e56;border-radius:8px;padding:10px 12px">'
    + '<div style="font-weight:800;color:#0f6e56;font-size:12px;margin-bottom:4px">✓ ĐẠT</div>'
    + '<div style="font-size:13px;color:#1b2430">' + esc(a.ok) + '</div>'
    + '</div>'
    + '<div style="background:#fbeae2;border:2px solid #aa4322;border-radius:8px;padding:10px 12px">'
    + '<div style="font-weight:800;color:#aa4322;font-size:12px;margin-bottom:4px">✗ KHÔNG ĐẠT</div>'
    + '<div style="font-size:13px;color:#1b2430">' + esc(a.notok) + '</div>'
    + '</div>'
    + '</div>'
    + (rows ? '<table style="width:100%;border-collapse:collapse;margin-bottom:6px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden">' + rows + '</table>' : '')
    + '<div style="font-size:11.5px;color:var(--muted);margin-bottom:14px">📖 ' + esc(a.ref) + '</div>';
}

function closeModal(){ document.getElementById('modal').innerHTML = ''; }
render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
