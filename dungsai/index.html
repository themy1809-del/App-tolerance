<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0c447c">
<title>Tra Cứu Dung Sai Kết Cấu Thép</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/icon-180.png">
<style>
  :root{
    --bg:#eef1f5; --card:#fff; --ink:#1b2430; --muted:#5f6b7a; --line:#dfe5ec;
    --brand:#0c447c; --brand2:#185fa5; --soft:#e6f1fb;
    --pass:#0f6e56; --pass-soft:#e3f6ee; --fail:#aa4322; --fail-soft:#fbeae2;
    --warn:#8a5a00; --warn-soft:#fdf3e2; --chip:#eef1f5;
    --r:14px; --sh:0 1px 2px rgba(20,30,45,.07),0 6px 20px rgba(20,30,45,.06);
    --navh:62px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
  button{font-family:inherit;cursor:pointer;border:0;background:none}
  input,select,textarea{font-family:inherit}
  /* app bar */
  .appbar{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0c447c,#0a3a6b);color:#fff;
    padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
  .appbar .logo{width:30px;height:30px;border-radius:8px;flex:none}
  .appbar h1{font-size:16px;margin:0;font-weight:700;line-height:1.15}
  .appbar .sub{font-size:11px;opacity:.8}
  .appbar .sp{flex:1}
  .lang{display:flex;background:rgba(255,255,255,.16);border-radius:8px;overflow:hidden}
  .lang button{color:#fff;padding:6px 11px;font-size:13px;font-weight:700;opacity:.65}
  .lang button.on{background:#fff;color:var(--brand);opacity:1}
  /* container */
  .main{max-width:1180px;margin:0 auto;padding:12px 14px calc(var(--navh) + 24px)}
  @media(min-width:980px){ .main{padding-bottom:28px} }
  /* nav */
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(0,0,0,.05)}
  .nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;padding:4px 10px;border-radius:10px;flex:1}
  .nav button .ic{font-size:20px;line-height:1}
  .nav button.on{color:var(--brand)}
  .nav button.on .ic{transform:translateY(-1px)}
  @media(min-width:980px){
    .nav{position:static;max-width:1180px;margin:10px auto 0;border:1px solid var(--line);border-radius:12px;justify-content:flex-start;gap:4px;padding:6px;box-shadow:var(--sh)}
    .nav button{flex:none;flex-direction:row;gap:7px;font-size:14px;padding:9px 16px}
    .nav button .ic{font-size:17px}
    .nav button.on{background:var(--soft)}
    body{order:0}
  }
  /* search */
  .search{position:relative;margin:12px 0 10px}
  .search input{width:100%;padding:13px 14px 13px 42px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff;box-shadow:var(--sh)}
  .search .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5;font-size:17px}
  .filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}
  .filters::-webkit-scrollbar{display:none}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:#33404e;white-space:nowrap;flex:none}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  details.more{margin:0 0 10px;border:1px solid var(--line);border-radius:12px;background:#fff;box-shadow:var(--sh)}
  details.more>summary{padding:11px 14px;font-weight:600;font-size:13.5px;color:var(--brand);cursor:pointer;list-style:none}
  details.more>summary::-webkit-details-marker{display:none}
  details.more>summary::after{content:"▾";float:right;opacity:.6}
  details.more[open]>summary::after{content:"▴"}
  .more .body{padding:0 14px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.more .body{grid-template-columns:1fr}}
  label.fld{display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:0 0 4px;text-transform:uppercase;letter-spacing:.3px}
  select,.inp{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;color:var(--ink)}
  /* lookup grid */
  .lookgrid{display:block}
  @media(min-width:980px){ .lookgrid{display:grid;grid-template-columns:390px 1fr;gap:16px;align-items:start} }
  .count{font-size:12.5px;color:var(--muted);margin:2px 2px 8px}
  .cards{display:flex;flex-direction:column;gap:10px}
  .rcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh);cursor:pointer;transition:.12s}
  .rcard:active{transform:scale(.99)}
  .rcard.on{outline:2px solid var(--brand);background:var(--soft)}
  .rcard .t{font-weight:700;font-size:14.5px;margin-bottom:5px}
  .rcard .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
  .badge{font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:6px;background:var(--soft);color:var(--brand)}
  .region{font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;background:#eef1f5;color:#4a5663}
  .tagf{font-size:11.5px;font-weight:600;color:#445}
  .warnpill{font-size:10.5px;font-weight:800;color:var(--warn);background:var(--warn-soft);padding:2px 7px;border-radius:6px}
  .empty{color:var(--muted);text-align:center;padding:46px 18px}
  /* detail */
  .detail-pane{}
  @media(min-width:980px){ .detail-pane{position:sticky;top:74px;max-height:calc(100vh - 90px);overflow-y:auto;overflow-x:hidden;padding-right:6px} .detail-pane::-webkit-scrollbar{width:8px} .detail-pane::-webkit-scrollbar-thumb{background:#cdd6df;border-radius:4px} }
  @media(max-width:979px){
    .detail-pane{position:fixed;inset:0;z-index:50;background:var(--bg);transform:translateX(100%);transition:transform .22s ease;overflow:auto;padding:0}
    body.detail-open .detail-pane{transform:translateX(0)}
    body.detail-open{overflow:hidden}
  }
  .dhead{display:none}
  @media(max-width:979px){ .dhead{display:flex;align-items:center;gap:10px;position:sticky;top:0;background:var(--brand);color:#fff;padding:max(10px,env(safe-area-inset-top)) 14px 10px;z-index:2}
    .dhead button{color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;gap:6px}
    .dpad{padding:14px} }
  @media(min-width:980px){ .dpad{padding:0} }
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin-bottom:14px}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:0;padding:13px 16px 0}
  .card .cbody{padding:14px 16px}
  .kv{display:grid;grid-template-columns:120px 1fr;gap:5px 12px;font-size:13.5px}
  .kv .k{color:var(--muted);font-weight:600}
  .formula{font-family:Consolas,monospace;background:#0c2238;color:#bfe0ff;padding:3px 8px;border-radius:6px;font-size:13px;display:inline-block}
  .accept{background:#f4faf7;border:1px solid #cfe8df;border-left:4px solid var(--pass);border-radius:10px;padding:11px 13px;font-size:13.5px;margin-top:12px}
  .cond{font-size:13px;color:#445;margin-top:10px}
  .note{font-size:12.5px;color:var(--muted);margin-top:9px}
  .warn{background:var(--warn-soft);border:1px solid #f0d9a8;border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;color:#6b4700;margin-top:10px}
  .evidence{background:#fbfdff;border:1px dashed var(--brand2);border-radius:12px;padding:12px 14px;margin-top:14px}
  .evidence .h{font-size:11px;font-weight:800;letter-spacing:.5px;color:var(--brand);text-transform:uppercase}
  .quote{font-style:italic;color:#33404e;border-left:3px solid var(--soft);padding-left:10px;margin-top:8px;font-size:12.5px}
  /* calculator */
  .inrow{display:flex;gap:10px;align-items:center;margin:8px 0}
  .inrow .lab{font-size:12px;color:var(--muted);min-width:120px}
  .inrow input{flex:1}
  .res{background:#0c2238;color:#fff;border-radius:12px;padding:14px;text-align:center;margin-top:12px}
  .res .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;opacity:.7}
  .res .big{font-size:30px;font-weight:800;margin-top:2px}
  .res .ex{font-size:12px;opacity:.78;margin-top:3px;font-family:Consolas,monospace;word-break:break-word}
  .verdict{border-radius:12px;padding:16px;text-align:center;margin-top:12px;font-weight:800;font-size:21px}
  .verdict.pass{background:var(--pass-soft);color:var(--pass);border:1px solid #b7e0d2}
  .verdict.fail{background:var(--fail-soft);color:var(--fail);border:1px solid #f0c4b3}
  .verdict.na{background:#eef1f5;color:#4a5663;border:1px solid var(--line);font-size:15px;font-weight:700}
  .verdict .sm{display:block;font-weight:600;font-size:13px;margin-top:4px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--brand);color:#fff;border-radius:11px;padding:11px 14px;font-size:13.5px;font-weight:700}
  .btn.alt{background:#fff;color:var(--brand);border:1px solid var(--brand2)}
  .btn.ghost{background:#eef1f5;color:#33404e}
  .btn.danger{background:#fbeae2;color:var(--fail)}
  .btn.block{width:100%}
  .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  /* tables */
  table.t{width:100%;border-collapse:collapse;font-size:13px}
  table.t th,table.t td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
  table.t th{background:#eef4fa;color:var(--brand);font-size:12px}
  table.t tr:nth-child(even) td{background:#fafcfe}
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
  .stdcard{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff;box-shadow:var(--sh)}
  .stdcard .c{font-weight:800;font-size:14px}
  .stdcard .d{font-size:12.5px;color:var(--muted);margin-top:3px}
  .sectitle{font-size:18px;font-weight:800;margin:6px 2px 12px}
  .lead{color:var(--muted);font-size:13.5px;margin:0 2px 12px}
  /* modal */
  .ovl{position:fixed;inset:0;z-index:60;background:rgba(15,22,32,.5);display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:760px){.ovl{align-items:center}}
  .modal{background:#fff;width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px}
  @media(min-width:760px){.modal{border-radius:18px}}
  .modal h3{margin:0 0 12px;font-size:18px}
  .modal label.fld{margin-top:12px}
  .modal .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--sh);margin-bottom:12px}
  .crumb-lab{font-size:13.5px;color:var(--ink)}
  .crumb-btn{margin-left:auto;background:var(--soft);color:var(--brand);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:700}
  .hero{text-align:center;padding:10px 0 2px}
  .hero-t{font-size:22px;font-weight:800;color:var(--brand)}
  .hero-s{font-size:14px;color:var(--muted);margin:8px auto 0;max-width:660px;line-height:1.5}
  .grp-h{font-size:12.5px;font-weight:800;color:var(--muted);margin:18px 2px 9px;display:flex;align-items:center;gap:8px;letter-spacing:.4px}
  .stdpick{background:#fff;border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:12px;padding:13px 14px;box-shadow:var(--sh);cursor:pointer;transition:transform .1s}
  .stdpick:active{transform:scale(.99)}
  .stdpick .sp-c{font-weight:800;font-size:15.5px;color:var(--brand)}
  .stdpick .sp-t{font-size:12.5px;color:var(--muted);margin-top:3px}
  .stdpick .sp-n{font-size:12px;font-weight:700;color:var(--ink);margin-top:9px}
  .diagram{background:#fbfdff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
  .diagram .dgh{font-size:11px;font-weight:800;letter-spacing:.4px;color:var(--brand);text-transform:uppercase;margin-bottom:6px}
  .diagram svg{width:100%;max-width:330px;height:auto;display:block;margin:0 auto}
  #credit{position:fixed;right:9px;bottom:5px;z-index:30;font-size:10px;color:rgba(27,36,48,0.4);pointer-events:none}
  @media(max-width:560px){
    .main{padding-left:10px;padding-right:10px}
    .appbar h1{font-size:15px}
    .inrow{flex-direction:column-reverse;align-items:stretch;gap:3px}
    .inrow .lab{min-width:auto}
    .inrow input{width:100%}
    .modal .row2{grid-template-columns:1fr}
    .modal{padding:14px}
    .res .big{font-size:26px}
    .verdict{font-size:19px}
    .rcard .t{font-size:15px}
  }
  @media(max-width:979px){ #credit{bottom:calc(var(--navh) + 6px);background:rgba(255,255,255,0.74);padding:1px 7px;border-radius:7px;color:rgba(27,36,48,0.6)} }
  @media print{ #credit{display:none} }
  textarea.inp{min-height:74px;resize:vertical;font-family:Consolas,monospace;font-size:13px}
  .pin{font-size:26px;letter-spacing:8px;text-align:center}
  .footer{font-size:11.5px;color:var(--muted);margin-top:18px;padding:12px 2px;border-top:1px solid var(--line)}
  .hideprint{}
  #report{display:none}
  @media print{ .appbar,.nav,.hideprint,.footer,.detail-pane .dhead{display:none!important} body{background:#fff} #report{display:block!important} #app{display:none!important} }
</style>
</head>

/* ===== engine ===== */
function evalExpr(expr,vars){ if(typeof expr!=="string") return NaN;
  if(!/^[0-9a-zA-Z_+\-*/^(),.\s±<>=?:]*$/.test(expr)) throw new Error("bad expr");
  let e=expr.replace(/±/g,"").replace(/\^/g,"**").replace(/\b(min|max|abs|round|sqrt|floor|ceil)\b/gi,m=>"Math."+m.toLowerCase());
  const n=Object.keys(vars||{}); const fn=new Function(...n,"return ("+e+");"); const r=fn(...n.map(k=>vars[k]));
  if(typeof r!=="number"||!isFinite(r)) throw new Error("non-finite"); return r; }
function rangeIndex(ranges,x){ for(let i=0;i<ranges.length;i++){ const r=ranges[i]; if(i===0){ if(x<=r.to) return i; } else if(x>r.from && x<=r.to) return i; } return ranges.length-1; }
function evalCell(cell,vars,unit){ // cell: "expr" (±) | ["lo","hi"] | ["lo",null] | [null,"hi"] | null(NR)
  if(cell==null) return {na:true};
  if(Array.isArray(cell)){ const lo=cell[0]==null?null:evalExpr(cell[0],vars); const hi=cell[1]==null?null:evalExpr(cell[1],vars);
    let expr; if(lo!=null&&hi!=null) expr=fmt(lo)+" … "+(hi>=0?"+":"")+fmt(hi)+" "+unit;
      else if(lo!=null) expr="≥ "+fmt(lo)+" "+unit; else expr="≤ "+(hi>=0?"+":"")+fmt(hi)+" "+unit;
    return {lo:lo,hi:hi,asym:true,expr:expr}; }
  const v=evalExpr(cell,vars); const showF=(typeof cell==="string"&&/[a-zA-Z]/.test(cell));
  return {value:v,expr:"±"+fmt(v)+" "+unit+(showF?"  (= "+cell+")":"")}; }
function computePermitted(rule,vars,cls){ const p=rule.permitted; try{
  if(p.kind==="REF") return {na:true,expr:p.expression};
  if(p.kind==="FIXED"){ const v=evalExpr(p.expression,{}); return {value:v,expr:"±"+fmt(v)+" "+p.unit}; }
  if(p.kind==="FORMULA"){ const v=evalExpr(p.expression,vars); return {value:v,expr:"±"+fmt(v)+" "+p.unit+"  (= "+p.expression+")"}; }
  if(p.kind==="TABLE"){ const c=cls||p.classes[0]; const bv=vars[p.bandVar]; if(bv==null||isNaN(bv)) return {need:1};
    const idx=rangeIndex(p.ranges,bv); const cell=p.cells[c][idx]; const v=evalExpr(cell,vars);
    return {value:v,expr:"±"+fmt(v)+" "+p.unit,rangeLabel:p.ranges[idx].l,cls:c}; }
  if(p.kind==="MULTI"){ const setKey=cls||(p.sets[0]&&p.sets[0].key); const set=p.sets.find(s=>s.key===setKey)||p.sets[0];
    let idx=0,rangeLabel=null;
    if(p.bands&&p.bands.length){ const bv=vars[p.bandVar]; if(bv==null||isNaN(bv)) return {need:1,set:set.key,setLabel:set.label}; idx=rangeIndex(p.bands,bv); rangeLabel=p.bands[idx].l; }
    const r=evalCell(set.cells[idx],vars,p.unit); r.rangeLabel=rangeLabel; r.set=set.key; r.setLabel=set.label; return r; }
}catch(err){ return {error:String(err.message||err)}; } return {error:"?"}; }
function judge(p,m){ if(p==null||isNaN(m)) return {status:"NA"}; const a=Math.abs(m); return {status:a<=p+1e-9?"PASS":"FAIL",margin:p-a}; }
function verdictOf(cp,m){ if(isNaN(m)||cp==null||cp.na||cp.error||cp.need) return null;
  if(cp.asym){ const okLo=cp.lo==null||m>=cp.lo-1e-9, okHi=cp.hi==null||m<=cp.hi+1e-9;
    let margin; if(cp.lo!=null&&cp.hi!=null) margin=Math.min(m-cp.lo,cp.hi-m); else if(cp.lo!=null) margin=m-cp.lo; else margin=cp.hi-m;
    return {status:(okLo&&okHi)?"PASS":"FAIL",margin:margin}; }
  if(cp.value!=null){ const a=Math.abs(m); return {status:a<=cp.value+1e-9?"PASS":"FAIL",margin:cp.value-a}; }
  return null; }
function fmt(n){ if(n==null||isNaN(n)) return "—"; return (Math.round(n*100)/100).toString(); }

function selectRule(id){ selectedId=id; calcVars={}; calcClass=null; measured=""; const r=ruleById(id); const p=r.permitted;
  if(p.variables) p.variables.forEach(v=>calcVars[v.symbol]=v.def!=null?v.def:"");
  if(p.kind==="TABLE"){ calcClass=p.classes[0]; const r0=p.ranges[0]; calcVars[p.bandVar]=r0.to>1e8?1000:Math.round((Math.max(r0.from,1)+r0.to)/2); }

function permittedSummary(r){ const p=r.permitted;
  if(p.kind==="REF") return `<em>${esc(p.expression)}</em>`;
  if(p.kind==="FIXED") return `<span class="formula">±${esc(p.expression)} ${esc(p.unit)}</span>`;
  if(p.kind==="FORMULA") return `<span class="formula">Δ = ±${esc(p.expression)} ${esc(p.unit)}</span>`;
  if(p.kind==="MULTI") return `<span class="formula">Essential + Functional C1/C2</span>`;
  return `<span class="formula">${LANG==='vi'?'tra bảng theo':'table by'} ${esc(p.bandVar)} × Class</span>`; }
function renderCalc(r){ const p=r.permitted;
  let h=`<div class="card"><h2>🧮 ${esc(T('calc'))}</h2><div class="cbody">`;
  if(p.kind==="REF"){ h+=`<div class="verdict na">${esc(T('na'))}</div><div class="note">${esc(tx(r.acceptance))}</div>`;
    h+=calcButtons(r); return h+`</div></div>`; }
  let chips=null, chipLabel=(k)=>esc(k);
  if(p.kind==="TABLE"&&p.classes.length>1){ chips=p.classes; }
  if(p.kind==="MULTI"&&p.sets.length>1){ chips=p.sets.map(s=>s.key); chipLabel=(k)=>{const s=p.sets.find(x=>x.key===k);return esc(s?tx(s.label):k);}; }
  if(chips){ h+=`<label class="fld">${p.kind==="MULTI"?(LANG==='vi'?'Loại dung sai':'Tolerance type'):esc(T('selClass'))}</label><div class="filters" id="calcClassChips">`+
    chips.map(c=>`<span class="chip ${calcClass===c?'on':''}" data-cls="${esc(c)}" onclick="selectClass('${esc(c)}')">${chipLabel(c)}</span>`).join("")+`</div>`; }
  let inputs=[];
  if(p.kind==="TABLE") inputs.push([p.bandVar,tx(p.bandLabel)||p.bandVar,"mm"]);
  if(p.kind==="MULTI"&&p.vars) p.vars.forEach(v=>inputs.push([v.symbol,tx(v.label)+" ("+v.symbol+")",v.unit||p.unit]));
  if(p.variables) p.variables.forEach(v=>inputs.push([v.symbol,tx(v.label)+" ("+v.symbol+")",v.unit]));
  if(inputs.length){ h+=`<label class="fld">${esc(T('inputs'))}</label>`; inputs.forEach(a=>{ h+=inRow(a[0],a[1],a[2],calcVars[a[0]]); }); }

  h+=`<div id="calcVerdict">${calcVerdictHtml(r,cp)}</div>`;

/* result + verdict rendered separately so typing never rebuilds the inputs (keeps cursor) */
function calcResHtml(r,cp){ const p=r.permitted;
  const tag=`${cp.rangeLabel?` · ${esc(cp.rangeLabel)}`:''}${cp.setLabel?` · ${esc(tx(cp.setLabel))}`:(cp.cls?' · '+esc(cp.cls):'')}`;
  let h=`<div class="res"><div class="lbl">${esc(T('permitted'))}${tag}</div>`;
  if(cp.error||cp.need) h+=`<div class="big">—</div><div class="ex">${esc(T('enterAll'))}</div>`;
  else if(cp.na) h+=`<div class="big" style="font-size:17px">${LANG==='vi'?'Không yêu cầu':'No requirement'}</div>`;
  else if(cp.asym) h+=`<div class="big" style="font-size:20px">${esc(cp.expr)}</div>`;
  else h+=`<div class="big">±${esc(fmt(cp.value))} <span style="font-size:15px">${esc(p.unit)}</span></div><div class="ex">${esc(cp.expr)}</div>`;
  return h+`</div>`; }
function calcVerdictHtml(r,cp){ const p=r.permitted; const m=parseFloat(measured);
  const j=verdictOf(cp,m); if(!j) return "";

  let pct=""; if(cp.value!=null&&cp.value>0){ const pv=Math.round(Math.abs(j.margin)/cp.value*1000)/10; pct=` (${pv}% ${LANG==='vi'?'quá dung sai':'over tolerance'})`; }
  return `<div class="verdict fail">❌ ${esc(T('fail'))}<span class="sm">${esc(T('exceed'))}: ${fmt(Math.abs(j.margin))} ${esc(p.unit)}${pct}</span></div>`; }

function validateRule(rule){ const p=rule.permitted;
  if(!rule.standard) return "Thiếu Tiêu chuẩn.";
  if(!rule.title||!rule.title.vi) return "Thiếu Tiêu đề (VI).";
  if(!rule.acceptance||!rule.acceptance.vi) return "Thiếu Tiêu chí chấp nhận (VI).";
  if(!rule.clause||!rule.clause.number) return "Thiếu Số điều khoản (dẫn chứng).";
  if(!rule.feature) return "Thiếu Đặc trưng.";
  if(!p||!p.kind) return "Thiếu loại dung sai (permitted.kind).";
  try{
    if(p.kind==="REF"){ if(!p.expression) return "REF: cần nội dung tham chiếu (expression)."; return ""; }
    if(p.kind==="FIXED"){ if(!p.expression) return "FIXED: thiếu giá trị."; const v=evalExpr(p.expression,{}); if(isNaN(v)) return "FIXED: giá trị phải tính ra số (vd 6, hoặc max(d/500,5))."; return ""; }
    if(p.kind==="FORMULA"){ if(!p.expression) return "FORMULA: thiếu biểu thức (vd h/300)."; const vs={}; (p.variables||[]).forEach(v=>vs[v.symbol]=v.def!=null?v.def:1);
      const v=evalExpr(p.expression,vs); if(isNaN(v)) return "FORMULA: không tính được — kiểm tra biến đã khai báo & biểu thức."; if(!p.variables||!p.variables.length){ if(/[a-zA-Z]/.test(p.expression.replace(/min|max|abs|round|sqrt|floor|ceil/g,""))) return "FORMULA: biểu thức có biến nhưng chưa khai báo biến (dòng: ký_hiệu|nhãn VI|nhãn EN|đơn vị|mặc định)."; } return ""; }
    if(p.kind==="TABLE"){ if(!p.bandVar) return "TABLE: thiếu bandVar (biến tra bảng)."; if(!Array.isArray(p.ranges)||!p.ranges.length) return "TABLE: thiếu ranges (dải)."; if(!Array.isArray(p.classes)||!p.classes.length) return "TABLE: thiếu classes.";
      for(const c of p.classes){ if(!p.cells||!Array.isArray(p.cells[c])) return "TABLE: thiếu cells['"+c+"']."; if(p.cells[c].length!==p.ranges.length) return "TABLE: cells['"+c+"'] có "+p.cells[c].length+" ô — cần đúng "+p.ranges.length+" ô (= số dải)."; }
      const vs={}; const r0=p.ranges[0]; vs[p.bandVar]=(r0.to>1e8?1000:(Math.max(r0.from,1)+r0.to)/2); const cp=computePermitted(rule,vs,p.classes[0]); if(cp&&cp.error) return "TABLE: ô bị lỗi tính — "+cp.error; return ""; }
    if(p.kind==="MULTI"){ if(!Array.isArray(p.sets)||!p.sets.length) return "MULTI: thiếu sets (bộ dung sai)."; const nb=p.bands?p.bands.length:1;
      for(const s of p.sets){ if(!s.key) return "MULTI: set thiếu 'key'."; if(!Array.isArray(s.cells)) return "MULTI: set '"+s.key+"' thiếu cells."; if(s.cells.length!==nb) return "MULTI: set '"+s.key+"' có "+s.cells.length+" ô — cần "+nb+" (= số bands)."; }
      const vs={}; (p.vars||[]).forEach(v=>vs[v.symbol]=v.def!=null?v.def:1); if(p.bandVar&&(vs[p.bandVar]==null)) vs[p.bandVar]=p.bands?((Math.max(p.bands[0].from,1)+p.bands[0].to)/2):1;
      const cp=computePermitted(rule,vs,p.sets[0].key); if(cp&&cp.error) return "MULTI: ô bị lỗi tính — "+cp.error; return ""; }
    return "Loại dung sai không hợp lệ: "+p.kind;
  }catch(e){ return "Lỗi cấu hình: "+e.message; }
}
function saveRule(id){ const g=i=>{ const e=document.getElementById(i); return e?e.value.trim():""; };
  const kind=g("m_kind"); let permitted;
  try{
    if(kind==="TABLE"){ permitted=JSON.parse(g("m_pjson")); permitted.kind="TABLE"; }
    else if(kind==="REF"){ permitted={kind:"REF",unit:g("m_unit")||"mm",expression:g("m_expr")}; }
    else if(kind==="FIXED"){ permitted={kind:"FIXED",unit:g("m_unit")||"mm",expression:g("m_expr")}; }
    else { permitted={kind:"FORMULA",unit:g("m_unit")||"mm",expression:g("m_expr")};
      const vt=g("m_vars"); if(vt){ permitted.variables=vt.split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{ const a=l.split("|");
        return {symbol:(a[0]||"").trim(),label:{vi:(a[1]||"").trim(),en:(a[2]||a[1]||"").trim()},unit:(a[3]||"mm").trim(),def:a[4]!=null&&a[4]!==""?parseFloat(a[4]):undefined}; }); } }
  }catch(e){ document.getElementById("m_msg").textContent="JSON: "+e.message; return; }
  const std=g("m_std"), tvi=g("m_tvi"), accvi=g("m_accvi"), cnum=g("m_cnum");
  if(!std||!tvi||!accvi||!cnum){ document.getElementById("m_msg").textContent=T('reqWarn'); return; }
  const stdObj=STDS().find(s=>s.code===std); const region=g("m_region")|| (stdObj?stdObj.region:"EU");
  const rule={ id: id||("custom_"+Date.now()), standard:std, region, category:g("m_cat"), feature:g("m_feat"),
    element:{vi:g("m_elvi"),en:g("m_elen")||g("m_elvi")}, title:{vi:tvi,en:g("m_ten")||tvi},
    permitted, conditions: g("m_condvi")?{vi:g("m_condvi"),en:g("m_condvi")}:undefined,
    acceptance:{vi:accvi,en:g("m_accen")||accvi},
    clause:{number:cnum, page: g("m_cpage")?parseInt(g("m_cpage")):0, quote:g("m_cquote")||""},
    needsVerify: document.getElementById("m_verify").checked||undefined };
  const verr=validateRule(rule); if(verr){ document.getElementById("m_msg").textContent="⚠ "+verr; return; }
  if(id){ const i=TOLS().findIndex(r=>r.id===id); if(i>=0) DATA.tolerances[i]=rule; } else { DATA.tolerances.push(rule); }
  saveData(); closeModal(); render();
}

/* import/export */
function exportDataFile(){ const txt="/* Tolerance dataset exported "+new Date().toISOString().slice(0,10)+" */\n(function(){ window.APP_DATA = "+JSON.stringify(DATA,null,2)+"; })();\n";
  dl("tolerances-data.js", txt, "text/javascript"); }
function importDataFile(input){ const f=input.files[0]; if(!f) return; const rd=new FileReader();
  rd.onload=()=>{ try{ let txt=rd.result; let obj;
      const m=txt.match(/window\.APP_DATA\s*=\s*([\s\S]*?);\s*\}\)\(\)/); if(m){ obj=JSON.parse(m[1]); } else { obj=JSON.parse(txt); }
      if(obj&&obj.tolerances){ DATA=obj; saveData(); render(); toast(LANG==='vi'?"Đã nhập dữ liệu":"Imported"); } else throw new Error("format");
    }catch(e){ alert((LANG==='vi'?"Không đọc được file: ":"Cannot read file: ")+e.message); } };
  rd.readAsText(f); input.value=""; }
function dl(name,text,type){ const b=new Blob(["﻿"+text],{type:(type||"text/csv")+";charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function csvRow(a){ return a.map(x=>'"'+String(x==null?"":x).replace(/"/g,'""')+'"').join(",")+"\n"; }
function exportCompareCsv(){ let c=csvRow(["Standard","Region","Feature","Element","Permitted","Acceptance","Clause"]);
  compare.forEach(id=>{ const r=ruleById(id); if(!r) return; const p=r.permitted;
    const perm=p.kind==="FORMULA"?("±"+p.expression+" "+p.unit):p.kind==="FIXED"?("±"+p.expression+" "+p.unit):p.kind==="TABLE"?("table by "+p.bandVar):p.expression;
    c+=csvRow([r.standard,r.region,(FEATURES[r.feature]||{}).en||r.feature,tx(r.element),perm,tx(r.acceptance),r.clause.number]); }); dl("so_sanh_dung_sai.csv",c); }

/* report */
function buildReport(){ const r=ruleById(selectedId); if(!r){ window.print(); return; }
  const cp=computePermitted(r,numVars(),calcClass); const m=parseFloat(measured); let status="—";
  { const j=verdictOf(cp,m); if(j) status=j.status==="PASS"?T('pass'):T('fail'); }
  const vr=Object.entries(numVars()).filter(([k,v])=>!isNaN(v)).map(([k,v])=>`${k} = ${v}`).join("; ");
  document.getElementById("report").innerHTML=`<div style="padding:8px">
    <h2 style="text-align:center;margin:0">${esc(T('reportTitle'))}</h2>
    <div style="text-align:center;color:#5f6b7a;margin:4px 0 16px">${esc(T('date'))}: ${new Date().toLocaleString()}</div>
    <table class="t"><tbody>
      <tr><th style="width:200px">${LANG==='vi'?'Dự án / Hạng mục':'Project / Item'}</th><td>${esc(repInfo.project||'—')}</td></tr>
      <tr><th>${esc(T('standard'))}</th><td>${esc(r.standard)} (${r.region})</td></tr>
      <tr><th>${LANG==='vi'?'Dung sai':'Tolerance'}</th><td>${esc(tx(r.title))} — ${esc(catName(r.category))}</td></tr>
      <tr><th>${esc(T('element'))} / ${esc(T('feature'))}</th><td>${esc(tx(r.element))} · ${esc(featName(r.feature))}</td></tr>
      <tr><th>${esc(T('inputs'))}</th><td>${esc(vr)}${calcClass?' · '+esc(calcClass):''}</td></tr>
      <tr><th>${esc(T('permitted'))}</th><td>${cp.na?(LANG==='vi'?'Không yêu cầu':'No requirement'):(cp.asym?esc(cp.expr):"±"+esc(fmt(cp.value))+" "+esc(r.permitted.unit))} ${(!cp.asym&&cp.expr)?'<br><small>'+esc(cp.expr)+'</small>':''}</td></tr>
      <tr><th>${esc(T('measured'))}</th><td>${isNaN(m)?"—":esc(m)+" "+esc(r.permitted.unit)}</td></tr>
      <tr><th>${LANG==='vi'?'Phương pháp đo':'Measurement method'}</th><td>${esc(repInfo.method||'—')}</td></tr>
      <tr><th>${esc(T('result'))}</th><td style="font-weight:800;font-size:18px">${esc(status)}</td></tr>
      <tr><th>${esc(T('acceptance'))}</th><td>${esc(tx(r.acceptance))}</td></tr>
      <tr><th>${esc(T('evidence'))}</th><td><strong>${esc(r.clause.number)}</strong>${r.clause.page?' · '+esc(T('page'))+' '+r.clause.page:''}${r.clause.quote?'<br><em>“'+esc(r.clause.quote)+'”</em>':''}</td></tr>
    </tbody></table>
    <div style="margin-top:16px;color:#5f6b7a;font-size:12px">${esc(T('disclaimer'))}</div>
    <div style="margin-top:40px;display:flex;justify-content:space-between"><div>${esc(T('inspector'))}: ${repInfo.inspector?esc(repInfo.inspector):'____________'}</div><div>${esc(T('signature'))}: ____________</div></div>
  </div>`;
  window.print();
}

/* misc */

/* misc */
function toast(msg){ const d=document.createElement("div"); d.textContent=msg;
  d.style.cssText="position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#0c2238;color:#fff;padding:10px 16px;border-radius:10px;z-index:90;font-size:13px;box-shadow:var(--sh)";
  document.body.appendChild(d); setTimeout(()=>d.remove(), 2200); }

/* bootstrap — load saved data nếu có, render lần đầu, đăng ký service worker */
try { const saved = localStorage.getItem("tol_data"); if (saved){ DATA = JSON.parse(saved); } } catch(e){}
render();
if ("serviceWorker" in navigator && location.protocol.indexOf("http")===0) {
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
